<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Controle Virtual - Arcade Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        /* Forçar orientação paisagem */
        @media screen and (orientation: portrait) {
            body::before {
                content: '↻ Gire o celular\Apara o modo paisagem';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 10, 0.98);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                font-size: 24px;
                text-align: center;
                white-space: pre-line;
                color: #5b6bc0;
                font-weight: 600;
            }
        }

        /* Header */
        .header {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid rgba(91, 107, 192, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 11px;
            font-weight: 600;
            color: #5b6bc0;
        }

        .status.connected {
            color: #4caf50;
        }

        .status.disconnected {
            color: #f44336;
        }

        .player-badge {
            padding: 4px 12px;
            background: linear-gradient(135deg, #5b6bc0, #3f51b5);
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
        }

        .back-btn {
            padding: 6px 14px;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            border: none;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(244, 67, 54, 0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .back-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(244, 67, 54, 0.6);
            background: linear-gradient(135deg, #d32f2f, #c62828);
        }

        /* Controller Layout - Horizontal */
        .controller-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: 1fr;
            align-items: center;
            justify-items: center;
            padding: 10px 20px;
            gap: 10px;
        }

        /* D-Pad */
        .dpad-container {
            grid-column: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 20px;
            position: relative;
        }

        .dpad {
            width: 150px;
            height: 150px;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 3px;
        }

        .dpad.hidden {
            display: none;
        }

        /* Analógico Virtual */
        .analog-stick {
            width: 150px;
            height: 150px;
            position: relative;
            display: none;
        }

        .analog-stick.active {
            display: block;
        }

        .analog-base {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.3), rgba(63, 81, 181, 0.2));
            border: 3px solid rgba(91, 107, 192, 0.6);
            position: relative;
            box-shadow: 0 2px 10px rgba(91, 107, 192, 0.4),
                        inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .analog-stick-knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.8), rgba(63, 81, 181, 0.7));
            border: 3px solid rgba(121, 134, 203, 0.9);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 3px 15px rgba(91, 107, 192, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: box-shadow 0.1s;
        }

        .analog-stick-knob:active {
            box-shadow: 0 5px 20px rgba(91, 107, 192, 0.9),
                        0 0 30px rgba(121, 134, 203, 0.7),
                        inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Botão de Alternância */
        .toggle-input-btn {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 12px;
            background: linear-gradient(145deg, rgba(100, 100, 130, 0.4), rgba(80, 80, 110, 0.3));
            border: 2px solid rgba(120, 120, 150, 0.7);
            border-radius: 15px;
            color: #ffffff;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(100, 100, 130, 0.3);
            transition: all 0.2s;
        }

        .toggle-input-btn:active {
            transform: translateX(-50%) scale(0.95);
            box-shadow: 0 1px 3px rgba(100, 100, 130, 0.4);
        }

        .dpad-btn {
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.4), rgba(63, 81, 181, 0.3));
            border: 2px solid rgba(91, 107, 192, 0.7);
            border-radius: 10px;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s ease;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 2px 8px rgba(91, 107, 192, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .dpad-btn:active {
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.7), rgba(63, 81, 181, 0.6));
            border-color: rgba(91, 107, 192, 0.95);
            transform: scale(0.92);
            box-shadow: 0 1px 4px rgba(91, 107, 192, 0.4),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .dpad-btn.pressed {
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.9), rgba(63, 81, 181, 0.8));
            border-color: #7986cb;
            box-shadow: 0 0 30px rgba(91, 107, 192, 0.8),
                        0 0 15px rgba(121, 134, 203, 0.6),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Special Buttons - Centro */
        .special-buttons {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .special-btn {
            padding: 10px 25px;
            background: linear-gradient(145deg, rgba(100, 100, 130, 0.4), rgba(80, 80, 110, 0.3));
            border: 2px solid rgba(120, 120, 150, 0.7);
            border-radius: 20px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.08s ease;
            touch-action: manipulation;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(100, 100, 130, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .special-btn:active {
            background: linear-gradient(145deg, rgba(100, 100, 130, 0.6), rgba(80, 80, 110, 0.5));
            transform: scale(0.92);
            box-shadow: 0 1px 4px rgba(100, 100, 130, 0.4),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Action Buttons - Direita */
        .action-buttons {
            grid-column: 3;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 20px;
        }

        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            transform: rotate(45deg);
        }

        .action-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.5), rgba(63, 81, 181, 0.4));
            border: 3px solid rgba(91, 107, 192, 0.8);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg);
            transition: all 0.08s ease;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 3px 10px rgba(91, 107, 192, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .action-btn:active {
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.8), rgba(63, 81, 181, 0.7));
            border-color: rgba(91, 107, 192, 0.95);
            transform: rotate(-45deg) scale(0.88);
            box-shadow: 0 1px 5px rgba(91, 107, 192, 0.5),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .action-btn.pressed {
            background: linear-gradient(145deg, rgba(91, 107, 192, 1), rgba(63, 81, 181, 0.9));
            border-color: #7986cb;
            box-shadow: 0 0 35px rgba(91, 107, 192, 0.9),
                        0 0 20px rgba(121, 134, 203, 0.7),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Fullscreen Button */
        .fullscreen-btn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 8px 12px;
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.5), rgba(63, 81, 181, 0.4));
            border: 2px solid rgba(91, 107, 192, 0.7);
            border-radius: 8px;
            color: #ffffff;
            font-size: 10px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(91, 107, 192, 0.4);
        }

        .fullscreen-btn:hover {
            background: linear-gradient(145deg, rgba(91, 107, 192, 0.7), rgba(63, 81, 181, 0.6));
            box-shadow: 0 3px 12px rgba(91, 107, 192, 0.6);
        }

        /* Special Buttons */
        .special-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
        }

        .special-btn {
            padding: 12px 30px;
            background: rgba(100, 100, 120, 0.2);
            border: 2px solid rgba(100, 100, 120, 0.4);
            border-radius: 25px;
            color: #dcdce2;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .special-btn:active {
            background: rgba(100, 100, 120, 0.4);
            transform: scale(0.95);
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 1000;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(75, 85, 180, 0.2);
            border-top-color: #5b6bc0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(200, 200, 210, 0.7);
            font-size: 14px;
        }

        /* Error */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244, 67, 54, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            z-index: 1001;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Modal de Confirmação */
        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .confirm-modal.show {
            display: flex;
        }

        .confirm-modal-content {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 2px solid rgba(91, 107, 192, 0.6);
            border-radius: 16px;
            padding: 30px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(91, 107, 192, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.8) translateY(-50px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .confirm-modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .confirm-modal-message {
            font-size: 15px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .confirm-modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .confirm-modal-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .confirm-modal-btn.cancel {
            background: linear-gradient(145deg, #424242, #303030);
            color: #ffffff;
            border: 2px solid #555555;
        }

        .confirm-modal-btn.cancel:active {
            transform: scale(0.95);
            background: linear-gradient(145deg, #303030, #202020);
        }

        .confirm-modal-btn.confirm {
            background: linear-gradient(145deg, #f44336, #d32f2f);
            color: #ffffff;
            border: 2px solid #f44336;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .confirm-modal-btn.confirm:active {
            transform: scale(0.95);
            background: linear-gradient(145deg, #d32f2f, #c62828);
            box-shadow: 0 2px 8px rgba(244, 67, 54, 0.6);
        }

        /* Audio Control */
        .audio-control {
            position: absolute;
            top: 8px;
            right: 15px;
            z-index: 100;
        }

        .audio-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, #5b6bc0, #3f51b5);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(91, 107, 192, 0.4);
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        .audio-btn.active {
            background: linear-gradient(135deg, #4caf50, #45a049);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
            }
            50% {
                box-shadow: 0 2px 15px rgba(76, 175, 80, 0.8);
            }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Conectando ao servidor...</div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>

    <!-- Header -->
    <div class="header">
        <button class="back-btn" id="backBtn" onclick="backToMenu()">
            ← Voltar
        </button>
        <div class="status" id="status">Desconectado</div>
        <div class="player-badge" id="playerBadge" style="display: none;">P1</div>
        <div class="audio-control">
            <button class="audio-btn" id="audioBtn" onclick="toggleAudio()" title="Áudio do Jogo">
                🔇
            </button>
        </div>
    </div>

    <!-- Audio Player (oculto) -->
    <audio id="gameAudio" autoplay style="display: none;"></audio>

    <!-- Controller -->
    <div class="controller-container" id="controller" style="display: none;">
        <!-- D-Pad (Esquerda) -->
        <div class="dpad-container">
            <!-- Botão de Alternância -->
            <button class="toggle-input-btn" id="toggleInputBtn" onclick="toggleInputMode()">
                🎮 Analógico
            </button>

            <!-- D-Pad Digital -->
            <div class="dpad" id="dpad">
                <div></div>
                <div class="dpad-btn" data-key="up">▲</div>
                <div></div>
                <div class="dpad-btn" data-key="left">◀</div>
                <div></div>
                <div class="dpad-btn" data-key="right">▶</div>
                <div></div>
                <div class="dpad-btn" data-key="down">▼</div>
                <div></div>
            </div>

            <!-- Analógico Virtual -->
            <div class="analog-stick" id="analogStick">
                <div class="analog-base">
                    <div class="analog-stick-knob" id="analogKnob"></div>
                </div>
            </div>
        </div>

        <!-- Special Buttons (Centro) -->
        <div class="special-buttons">
            <button class="special-btn" data-key="select">SELECT</button>
            <button class="special-btn" data-key="start">START</button>
        </div>

        <!-- Action Buttons (Direita) -->
        <div class="action-buttons">
            <div class="action-group">
                <div class="action-btn" data-key="y">Y</div>
                <div class="action-btn" data-key="x">X</div>
                <div class="action-btn" data-key="b">B</div>
                <div class="action-btn" data-key="a">A</div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">🖥️ Tela Cheia</button>

    <!-- Modal de Confirmação -->
    <div class="confirm-modal" id="confirmModal">
        <div class="confirm-modal-content">
            <div class="confirm-modal-title">
                <span>⚠️</span>
                <span>Voltar ao Menu</span>
            </div>
            <div class="confirm-modal-message">
                Deseja realmente voltar ao menu inicial?<br>
                O jogo será fechado na tela principal.
            </div>
            <div class="confirm-modal-buttons">
                <button class="confirm-modal-btn cancel" onclick="closeConfirmModal()">
                    Cancelar
                </button>
                <button class="confirm-modal-btn confirm" onclick="confirmBackToMenu()">
                    Voltar
                </button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let playerNumber = null;
        let pressedKeys = new Set();
        let isAnalogMode = false;
        let analogActive = false;
        let analogInterval = null;

        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const playerBadge = document.getElementById('playerBadge');
        const controller = document.getElementById('controller');
        const errorMessage = document.getElementById('errorMessage');
        const dpad = document.getElementById('dpad');
        const analogStick = document.getElementById('analogStick');
        const analogKnob = document.getElementById('analogKnob');
        const toggleBtn = document.getElementById('toggleInputBtn');
        const audioBtn = document.getElementById('audioBtn');
        const gameAudio = document.getElementById('gameAudio');
        let audioEnabled = false;
        let audioContext = null;
        let mediaSource = null;

        // Pegar sessionId da URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session') || 'generic';
        console.log('📱 Controle iniciado para sessão:', sessionId);

        // Conectar ao servidor
        socket.on('connect', () => {
            console.log('Conectado ao servidor');
            // Enviar sessionId ao registrar
            socket.emit('register-controller', { sessionId: sessionId });
        });

        // Registrado com sucesso
        socket.on('controller-registered', (data) => {
            playerNumber = data.player;
            loading.classList.add('hidden');
            controller.style.display = 'grid'; // Mudado de flex para grid
            status.textContent = 'Conectado';
            status.className = 'status connected';
            playerBadge.textContent = `P${playerNumber}`;
            playerBadge.style.display = 'block';
            
            // Vibrar ao conectar
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            // Tentar fullscreen automaticamente após 1 segundo
            setTimeout(() => {
                requestFullscreen();
            }, 1000);
        });

        // Servidor cheio
        socket.on('controller-full', () => {
            loading.classList.add('hidden');
            showError('Máximo de 2 jogadores conectados!');
        });

        // Desconectado
        socket.on('disconnect', () => {
            status.textContent = 'Desconectado';
            status.className = 'status disconnected';
            controller.style.display = 'none';
            loading.classList.remove('hidden');
        });

        // Vibração
        socket.on('vibrate', (data) => {
            if (navigator.vibrate) {
                navigator.vibrate(data.pattern || 100);
            }
        });

        // Mostrar erro
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        // Enviar input
        function sendInput(key, pressed) {
            socket.emit('controller-input', {
                key: key,
                pressed: pressed,
                timestamp: Date.now()
            });
        }

        // Alternar entre D-Pad e Analógico
        function toggleInputMode() {
            isAnalogMode = !isAnalogMode;
            
            if (isAnalogMode) {
                dpad.classList.add('hidden');
                analogStick.classList.add('active');
                toggleBtn.textContent = '🕹️ D-Pad';
            } else {
                dpad.classList.remove('hidden');
                analogStick.classList.remove('active');
                toggleBtn.textContent = '🎮 Analógico';
                
                // Liberar teclas pressionadas pelo analógico
                releaseAllAnalogKeys();
            }
            
            // Vibração de feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Liberar todas as teclas do analógico
        function releaseAllAnalogKeys() {
            ['up', 'down', 'left', 'right'].forEach(key => {
                if (pressedKeys.has(key)) {
                    pressedKeys.delete(key);
                    sendInput(key, false);
                }
            });
        }

        // Controle do Analógico Virtual
        let analogStartX = 0;
        let analogStartY = 0;
        let analogCenterX = 0;
        let analogCenterY = 0;

        function setupAnalogStick() {
            const base = analogStick.querySelector('.analog-base');
            const knob = analogKnob;
            
            const maxDistance = 45; // Distância máxima do centro
            const deadzone = 10; // Zona morta central

            function handleAnalogMove(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let deltaX = clientX - centerX;
                let deltaY = clientY - centerY;
                
                // Calcular distância do centro
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Limitar ao raio máximo
                if (distance > maxDistance) {
                    const angle = Math.atan2(deltaY, deltaX);
                    deltaX = Math.cos(angle) * maxDistance;
                    deltaY = Math.sin(angle) * maxDistance;
                }
                
                // Mover o knob
                knob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                
                // Processar direções (com zona morta)
                const currentUp = pressedKeys.has('up');
                const currentDown = pressedKeys.has('down');
                const currentLeft = pressedKeys.has('left');
                const currentRight = pressedKeys.has('right');
                
                const shouldPressUp = deltaY < -deadzone;
                const shouldPressDown = deltaY > deadzone;
                const shouldPressLeft = deltaX < -deadzone;
                const shouldPressRight = deltaX > deadzone;
                
                // Atualizar teclas baseado na posição
                if (shouldPressUp && !currentUp) {
                    pressedKeys.add('up');
                    sendInput('up', true);
                } else if (!shouldPressUp && currentUp) {
                    pressedKeys.delete('up');
                    sendInput('up', false);
                }
                
                if (shouldPressDown && !currentDown) {
                    pressedKeys.add('down');
                    sendInput('down', true);
                } else if (!shouldPressDown && currentDown) {
                    pressedKeys.delete('down');
                    sendInput('down', false);
                }
                
                if (shouldPressLeft && !currentLeft) {
                    pressedKeys.add('left');
                    sendInput('left', true);
                } else if (!shouldPressLeft && currentLeft) {
                    pressedKeys.delete('left');
                    sendInput('left', false);
                }
                
                if (shouldPressRight && !currentRight) {
                    pressedKeys.add('right');
                    sendInput('right', true);
                } else if (!shouldPressRight && currentRight) {
                    pressedKeys.delete('right');
                    sendInput('right', false);
                }
            }

            function resetAnalog() {
                knob.style.transform = 'translate(-50%, -50%)';
                releaseAllAnalogKeys();
            }

            // Touch events
            knob.addEventListener('touchstart', (e) => {
                e.preventDefault();
                analogActive = true;
                if (navigator.vibrate) navigator.vibrate(10);
            });

            knob.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (analogActive) {
                    const touch = e.touches[0];
                    handleAnalogMove(touch.clientX, touch.clientY);
                }
            });

            knob.addEventListener('touchend', (e) => {
                e.preventDefault();
                analogActive = false;
                resetAnalog();
            });

            // Mouse events (para testes no PC)
            knob.addEventListener('mousedown', (e) => {
                e.preventDefault();
                analogActive = true;
            });

            document.addEventListener('mousemove', (e) => {
                if (analogActive && isAnalogMode) {
                    handleAnalogMove(e.clientX, e.clientY);
                }
            });

            document.addEventListener('mouseup', () => {
                if (analogActive) {
                    analogActive = false;
                    resetAnalog();
                }
            });
        }

        // Inicializar analógico
        setupAnalogStick();

        // Controles touch
        const buttons = document.querySelectorAll('.dpad-btn, .action-btn, .special-btn');

        buttons.forEach(btn => {
            const key = btn.dataset.key;

            // Touch start
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!pressedKeys.has(key)) {
                    pressedKeys.add(key);
                    btn.classList.add('pressed');
                    sendInput(key, true);
                    
                    // Vibração leve
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                }
            });

            // Touch end
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (pressedKeys.has(key)) {
                    pressedKeys.delete(key);
                    btn.classList.remove('pressed');
                    sendInput(key, false);
                }
            });

            // Mouse events (para testes)
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!pressedKeys.has(key)) {
                    pressedKeys.add(key);
                    btn.classList.add('pressed');
                    sendInput(key, true);
                }
            });

            btn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                if (pressedKeys.has(key)) {
                    pressedKeys.delete(key);
                    btn.classList.remove('pressed');
                    sendInput(key, false);
                }
            });
        });

        // Prevenir scroll
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Manter tela ligada
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(err => {
                console.log('Wake Lock error:', err);
            });
        }

        // Função para entrar em fullscreen
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
            } else if (elem.webkitRequestFullscreen) { // Safari
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Firefox
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement && 
                !document.msFullscreenElement) {
                requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Voltar ao menu inicial
        function backToMenu() {
            // Abrir modal de confirmação
            const modal = document.getElementById('confirmModal');
            modal.classList.add('show');
            
            // Vibrar feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Fechar modal de confirmação
        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('show');
            
            // Vibrar feedback
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        // Confirmar voltar ao menu
        function confirmBackToMenu() {
            // Fechar modal
            closeConfirmModal();
            
            // Vibrar feedback
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 50]);
            }
            
            // Enviar comando ao servidor para fechar o jogo
            if (socket && socket.connected) {
                socket.emit('back-to-menu');
                console.log('🔙 Enviando comando: voltar ao menu');
            }
            
            // Feedback visual
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.textContent = '✓ Enviado';
                setTimeout(() => {
                    backBtn.textContent = '← Voltar';
                }, 1500);
            }
        }

        // Ocultar botão de fullscreen quando em fullscreen
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreenBtn');
            if (document.fullscreenElement) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        });

        // Fechar modal ao clicar fora
        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmModal') {
                closeConfirmModal();
            }
        });

        // Toggle Audio
        function toggleAudio() {
            audioEnabled = !audioEnabled;
            
            if (audioEnabled) {
                audioBtn.textContent = '🔊';
                audioBtn.classList.add('active');
                socket.emit('enable-audio', { player: playerNumber });
                console.log('🔊 Áudio habilitado');
                
                // Vibrar confirmação
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            } else {
                audioBtn.textContent = '🔇';
                audioBtn.classList.remove('active');
                socket.emit('disable-audio', { player: playerNumber });
                console.log('🔇 Áudio desabilitado');
                
                // Parar áudio
                gameAudio.pause();
                gameAudio.src = '';
            }
        }

        // Buffer de áudio para streaming contínuo
        let audioChunks = [];
        let isPlayingAudio = false;

        // Receber stream de áudio do servidor
        socket.on('audio-stream', (audioData) => {
            if (!audioEnabled) return;
            
            try {
                console.log('📥 Chunk de áudio recebido:', audioData.substring(0, 50) + '...');
                
                // Converter base64 para blob
                const audioBlob = base64ToBlob(audioData, 'audio/webm;codecs=opus');
                const audioUrl = URL.createObjectURL(audioBlob);
                
                // Adicionar ao buffer
                audioChunks.push(audioUrl);
                
                // Se não estiver tocando, iniciar reprodução
                if (!isPlayingAudio && audioChunks.length > 0) {
                    playNextChunk();
                }
            } catch (error) {
                console.error('❌ Erro ao processar áudio:', error);
            }
        });

        // Reproduzir próximo chunk
        function playNextChunk() {
            if (audioChunks.length === 0) {
                isPlayingAudio = false;
                return;
            }
            
            isPlayingAudio = true;
            const audioUrl = audioChunks.shift();
            
            gameAudio.src = audioUrl;
            gameAudio.play()
                .then(() => {
                    console.log('▶️ Reproduzindo áudio');
                })
                .catch(err => {
                    console.error('❌ Erro ao reproduzir:', err);
                    // Tentar próximo chunk
                    playNextChunk();
                });
            
            // Quando terminar, tocar o próximo
            gameAudio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                playNextChunk();
            };
        }

        // Converter base64 para Blob
        function base64ToBlob(base64, type) {
            try {
                const byteCharacters = atob(base64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                return new Blob([byteArray], { type: type });
            } catch (error) {
                console.error('❌ Erro ao converter base64:', error);
                throw error;
            }
        }

        // Receber e reproduzir teste de áudio
        socket.on('test-audio-play', (audioData) => {
            console.log('🔊 Recebendo áudio de teste...');
            
            try {
                // Converter base64 para blob
                const audioBlob = base64ToBlob(audioData, 'audio/webm;codecs=opus');
                const audioUrl = URL.createObjectURL(audioBlob);
                
                // Criar elemento de áudio temporário
                const testAudio = new Audio(audioUrl);
                testAudio.volume = 1.0;
                
                testAudio.onplay = () => {
                    console.log('▶️ Reproduzindo teste de áudio');
                    // Vibrar para confirmar
                    if (navigator.vibrate) {
                        navigator.vibrate(100);
                    }
                };
                
                testAudio.onended = () => {
                    console.log('✅ Teste de áudio concluído');
                    URL.revokeObjectURL(audioUrl);
                };
                
                testAudio.onerror = (err) => {
                    console.error('❌ Erro ao reproduzir teste:', err);
                    URL.revokeObjectURL(audioUrl);
                };
                
                // Reproduzir
                testAudio.play().catch(err => {
                    console.error('❌ Erro ao iniciar reprodução:', err);
                });
                
            } catch (error) {
                console.error('❌ Erro ao processar teste de áudio:', error);
            }
        });
    </script>
</body>
</html>
