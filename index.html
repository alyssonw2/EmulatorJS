<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Arcade Station</title>
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body, html {
                height: 100%;
                width: 100%;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
                background: #0a0a0a;
                color: #e8e8e8;
            }

            /* Background elegante */
            .background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0a0a0a 100%);
                z-index: -1;
                overflow: hidden;
            }

            .background::before {
                content: '';
                position: absolute;
                width: 100%;
                height: 100%;
                background: 
                    linear-gradient(90deg, rgba(100,100,120,0.03) 1px, transparent 1px),
                    linear-gradient(0deg, rgba(100,100,120,0.03) 1px, transparent 1px);
                background-size: 60px 60px;
                opacity: 0.3;
            }

            .background::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle at 50% 50%, rgba(75, 85, 180, 0.15) 0%, transparent 50%);
                animation: backgroundPulse 20s ease-in-out infinite;
            }

            @keyframes backgroundPulse {
                0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
                50% { transform: translate(-10%, -10%) scale(1.1); opacity: 0.5; }
            }

            /* Header minimalista e elegante */
            .header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 70px;
                background: rgba(13, 13, 13, 0.85);
                backdrop-filter: blur(30px) saturate(180%);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 50px;
                z-index: 100;
                border-bottom: 1px solid rgba(75, 85, 180, 0.25);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 30px;
            }

            .logo {
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.5px;
                color: #e8e8e8;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo::before {
                content: '◆';
                font-size: 16px;
                color: #5b6bc0;
            }

            .time {
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.5);
                letter-spacing: 1px;
                font-variant-numeric: tabular-nums;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .user-info span {
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.6);
                letter-spacing: 0.5px;
            }

            /* Indicadores de Controles */
            .controllers-status {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-right: 10px;
            }

            .controller-indicator {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                background: rgba(30, 30, 40, 0.6);
                border: 1px solid rgba(91, 107, 192, 0.25);
                border-radius: 20px;
                transition: all 0.3s ease;
            }

            .controller-indicator.connected {
                background: rgba(40, 50, 60, 0.7);
                border-color: rgba(76, 175, 80, 0.5);
                box-shadow: 0 0 15px rgba(76, 175, 80, 0.2);
            }

            .controller-icon {
                font-size: 18px;
                filter: grayscale(100%);
                opacity: 0.5;
                transition: all 0.3s ease;
            }

            .controller-indicator.connected .controller-icon {
                filter: grayscale(0%);
                opacity: 1;
            }

            .controller-status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #6b6b7b;
                box-shadow: 0 0 5px rgba(107, 107, 123, 0.3);
                transition: all 0.3s ease;
            }

            .controller-indicator.connected .controller-status-dot {
                background: #4caf50;
                box-shadow: 0 0 12px rgba(76, 175, 80, 0.8),
                            0 0 20px rgba(76, 175, 80, 0.4);
                animation: pulse-dot 2s infinite;
            }

            @keyframes pulse-dot {
                0%, 100% {
                    transform: scale(1);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.2);
                    opacity: 0.8;
                }
            }

            .controller-label {
                font-size: 11px;
                font-weight: 600;
                color: rgba(200, 200, 210, 0.6);
                transition: all 0.3s ease;
            }

            .controller-indicator.connected .controller-label {
                color: rgba(220, 230, 240, 0.95);
            }

            .user-avatar {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: linear-gradient(135deg, #5b6bc0 0%, #4a5a99 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 14px;
                border: 2px solid rgba(75, 85, 180, 0.4);
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .user-avatar:hover {
                transform: scale(1.05);
                border-color: rgba(75, 85, 180, 0.7);
                box-shadow: 0 0 20px rgba(75, 85, 180, 0.5);
            }

            /* Container principal */
            .main-container {
                position: relative;
                width: 100%;
                height: calc(100% - 60px);
                margin-top: 60px;
                overflow: hidden;
            }

            /* Background de vídeo/imagem do jogo */
            .game-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 0.8s ease-in-out;
                overflow: hidden;
                z-index: 1;
            }

            .game-background.active {
                opacity: 1;
                transition: opacity 1s ease-in-out;
            }

            .game-background::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, 
                    rgba(13,13,13,0.4) 0%, 
                    rgba(13,13,13,0.75) 50%, 
                    rgba(10,10,10,0.95) 100%);
                z-index: 2;
            }

            .game-background img,
            .game-background video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(15px) brightness(0.5) saturate(1.3);
                transform: scale(1.1);
            }

            /* Detalhes do jogo selecionado */
            .game-details {
                position: absolute;
                bottom: 400px;
                left: 80px;
                max-width: 650px;
                z-index: 10;
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .game-details.active {
                opacity: 1;
                transform: translateY(0);
            }

            .game-title {
                font-size: 56px;
                font-weight: 700;
                margin-bottom: 20px;
                text-shadow: 0 4px 30px rgba(0,0,0,0.9);
                letter-spacing: -1px;
                line-height: 1.1;
                color: #e8e8e8;
            }

            .game-meta {
                display: flex;
                gap: 15px;
                margin-bottom: 25px;
                font-size: 12px;
            }

            .game-meta span {
                padding: 6px 14px;
                background: rgba(75, 85, 180, 0.18);
                border: 1px solid rgba(75, 85, 180, 0.35);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                font-weight: 500;
                color: rgba(220, 220, 230, 0.85);
                letter-spacing: 0.5px;
                transition: all 0.3s ease;
            }

            .game-meta span:hover {
                background: rgba(75, 85, 180, 0.28);
                border-color: rgba(75, 85, 180, 0.55);
            }

            .game-description {
                font-size: 15px;
                line-height: 1.7;
                color: rgba(200, 200, 210, 0.75);
                margin-bottom: 35px;
                text-shadow: 0 2px 10px rgba(0,0,0,0.6);
                font-weight: 300;
                max-width: 550px;
            }

            .game-actions {
                display: flex;
                gap: 15px;
            }

            .btn {
                padding: 14px 32px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                align-items: center;
                gap: 10px;
                letter-spacing: 0.3px;
                position: relative;
                overflow: hidden;
            }

            .btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
                transition: left 0.5s ease;
            }

            .btn:hover::before {
                left: 100%;
            }

            .btn-primary {
                background: linear-gradient(135deg, #5b6bc0 0%, #3f51b5 100%);
                color: #ffffff;
                box-shadow: 0 4px 15px rgba(75, 85, 180, 0.45);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.65);
            }

            .btn-primary:active {
                transform: translateY(0);
            }

            .btn-secondary {
                background: rgba(100, 100, 120, 0.08);
                color: rgba(220, 220, 230, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(100, 100, 120, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(100, 100, 120, 0.15);
                border-color: rgba(100, 100, 120, 0.35);
                transform: translateY(-2px);
            }

            /* Carrossel de jogos elegante */
            .games-carousel {
                position: absolute;
                bottom: 50px;
                left: 0;
                right: 0;
                height: 320px;
                display: flex;
                align-items: center;
                z-index: 20;
                padding: 0 80px;
                overflow: visible;
            }

            .carousel-track {
                display: flex;
                gap: 25px;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                padding: 20px 0;
            }

            .game-card {
                min-width: 200px;
                height: 280px;
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                position: relative;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                border: 2px solid rgba(75, 85, 180, 0);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            }

            .game-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, 
                    transparent 0%, 
                    rgba(13,13,13,0.4) 60%,
                    rgba(10,10,10,0.92) 100%);
                z-index: 1;
                transition: opacity 0.3s ease;
            }

            .game-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                filter: brightness(0.8) saturate(1.05) contrast(1.05);
            }

            .game-card-title {
                position: absolute;
                bottom: 15px;
                left: 15px;
                right: 15px;
                font-size: 13px;
                font-weight: 600;
                z-index: 2;
                text-shadow: 0 2px 8px rgba(0,0,0,0.95);
                opacity: 0;
                transition: all 0.3s ease;
                letter-spacing: 0.3px;
                line-height: 1.3;
                color: #e8e8e8;
            }

            .game-card.selected {
                transform: scale(1.15) translateY(-20px);
                border-color: rgba(75, 85, 180, 0.85);
                box-shadow: 
                    0 20px 50px rgba(0, 0, 0, 0.9),
                    0 0 40px rgba(75, 85, 180, 0.35);
                z-index: 10;
            }

            .game-card.selected::before {
                background: linear-gradient(to bottom, 
                    transparent 0%, 
                    rgba(75, 85, 180, 0.12) 60%,
                    rgba(10,10,10,0.88) 100%);
            }

            .game-card.selected img {
                transform: scale(1.05);
                filter: brightness(0.95) saturate(1.2) contrast(1.1);
            }

            .game-card.selected .game-card-title {
                opacity: 1;
                transform: translateY(-5px);
            }

            .game-card:hover:not(.selected) {
                transform: scale(1.05) translateY(-8px);
                border-color: rgba(75, 85, 180, 0.35);
            }

            /* Navegação do carrossel */
            .carousel-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(75, 85, 180, 0.18);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(75, 85, 180, 0.35);
                width: 45px;
                height: 45px;
                border-radius: 12px;
                color: rgba(220, 220, 230, 0.9);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 30;
                font-size: 18px;
            }

            .carousel-nav:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
                transform: translateY(-50%) scale(1.08);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.45);
            }

            .carousel-nav:active {
                transform: translateY(-50%) scale(0.95);
            }

            .carousel-nav.left {
                left: 20px;
            }

            .carousel-nav.right {
                right: 20px;
            }

            /* Display do emulador */
            #display {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
                display: none;
                background: black;
            }

            #display.active {
                display: block;
            }

            #game {
                width: 100%;
                height: 100%;
            }

            /* Loading elegante */
            .loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 2000;
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .loading.active {
                display: flex;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(75, 85, 180, 0.25);
                border-top-color: #5b6bc0;
                border-radius: 50%;
                animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .loading::after {
                content: 'Carregando...';
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.6);
                letter-spacing: 1px;
            }

            /* Botão de voltar */
            .back-button {
                position: fixed;
                top: 85px;
                left: 30px;
                z-index: 1001;
                background: rgba(75, 85, 180, 0.18);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(75, 85, 180, 0.35);
                color: rgba(220, 220, 230, 0.9);
                padding: 12px 24px;
                border-radius: 10px;
                cursor: pointer;
                display: none;
                transition: all 0.3s ease;
                font-weight: 600;
                font-size: 13px;
                letter-spacing: 0.3px;
            }

            .back-button.active {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .back-button:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.45);
            }

            .back-button:active {
                transform: translateY(0);
            }

            /* Responsivo */
            @media (max-width: 768px) {
                .game-title {
                    font-size: 36px;
                }

                .game-details {
                    left: 30px;
                    right: 30px;
                    bottom: 300px;
                    max-width: none;
                }

                .games-carousel {
                    padding: 0 30px;
                    height: 250px;
                }

                .game-card {
                    min-width: 160px;
                    height: 220px;
                }

                .header {
                    padding: 0 30px;
                    height: 60px;
                }

                .logo {
                    font-size: 18px;
                }
            }

            /* Controller Modal */
            .controller-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(20px);
                z-index: 500;
                display: none;
                align-items: center;
                justify-content: center;
                animation: fadeIn 0.3s ease;
            }

            .controller-modal.active {
                display: flex;
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            .modal-content {
                background: rgba(26, 26, 26, 0.95);
                border: 1px solid rgba(75, 85, 180, 0.3);
                border-radius: 16px;
                padding: 40px;
                max-width: 500px;
                width: 90%;
                text-align: center;
            }

            .modal-title {
                font-size: 24px;
                font-weight: 700;
                color: #e8e8e8;
                margin-bottom: 10px;
            }

            .modal-subtitle {
                font-size: 14px;
                color: rgba(200, 200, 210, 0.6);
                margin-bottom: 30px;
            }

            .qr-container {
                background: white;
                padding: 20px;
                border-radius: 12px;
                display: inline-block;
                margin-bottom: 20px;
            }

            .qr-container img {
                display: block;
                width: 250px;
                height: 250px;
            }

            .controller-url {
                font-size: 12px;
                color: #5b6bc0;
                margin-bottom: 25px;
                word-break: break-all;
                font-family: monospace;
            }

            .controller-status {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-bottom: 25px;
            }

            .player-status {
                padding: 10px 20px;
                background: rgba(75, 85, 180, 0.15);
                border: 1px solid rgba(75, 85, 180, 0.3);
                border-radius: 8px;
                font-size: 13px;
                font-weight: 600;
                color: rgba(200, 200, 210, 0.7);
            }

            .player-status.connected {
                background: rgba(76, 175, 80, 0.2);
                border-color: rgba(76, 175, 80, 0.5);
                color: #4caf50;
            }

            .close-modal {
                padding: 12px 32px;
                background: rgba(100, 100, 120, 0.15);
                border: 1px solid rgba(100, 100, 120, 0.3);
                border-radius: 8px;
                color: rgba(220, 220, 230, 0.9);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .close-modal:hover {
                background: rgba(100, 100, 120, 0.25);
                transform: translateY(-2px);
            }

            /* Controller Button in Header */
            .controller-btn {
                padding: 8px 18px;
                background: rgba(75, 85, 180, 0.2);
                border: 1px solid rgba(75, 85, 180, 0.35);
                border-radius: 8px;
                color: rgba(220, 220, 230, 0.9);
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .controller-btn:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
            }

            .controller-btn::before {
                content: '🎮';
                font-size: 16px;
            }

            /* Game Details Modal */
            .game-details-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(20px);
                z-index: 600;
                display: none;
                align-items: center;
                justify-content: center;
                animation: fadeIn 0.3s ease;
                overflow-y: auto;
            }

            .game-details-modal.active {
                display: flex;
            }

            .game-details-content {
                background: linear-gradient(145deg, rgba(26, 26, 26, 0.98), rgba(20, 20, 20, 0.98));
                border: 1px solid rgba(91, 107, 192, 0.35);
                border-radius: 20px;
                max-width: 900px;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                position: relative;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            }

            .game-details-header {
                position: relative;
                height: 300px;
                border-radius: 20px 20px 0 0;
                overflow: hidden;
            }

            .game-details-bg {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: brightness(0.4);
            }

            .game-details-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 30px 40px;
                background: linear-gradient(to top, rgba(10, 10, 10, 0.95), transparent);
            }

            .game-details-title {
                font-size: 36px;
                font-weight: 700;
                color: #e8e8e8;
                margin-bottom: 10px;
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            }

            .game-details-meta {
                display: flex;
                gap: 15px;
                flex-wrap: wrap;
                font-size: 13px;
            }

            .meta-tag {
                padding: 6px 14px;
                background: rgba(91, 107, 192, 0.25);
                border: 1px solid rgba(91, 107, 192, 0.4);
                border-radius: 20px;
                color: rgba(220, 220, 230, 0.9);
                font-weight: 600;
            }

            .game-details-body {
                padding: 40px;
            }

            .details-section {
                margin-bottom: 35px;
            }

            .details-section-title {
                font-size: 18px;
                font-weight: 700;
                color: #5b6bc0;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .details-section-content {
                font-size: 15px;
                line-height: 1.8;
                color: rgba(200, 200, 210, 0.85);
            }

            .details-info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }

            .info-item {
                background: rgba(91, 107, 192, 0.08);
                border: 1px solid rgba(91, 107, 192, 0.2);
                border-radius: 12px;
                padding: 20px;
            }

            .info-label {
                font-size: 12px;
                color: rgba(200, 200, 210, 0.5);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .info-value {

            .game-details-actions {
                display: flex;
                gap: 15px;

                border-top: 1px solid rgba(91, 107, 192, 0.2);

            .btn-play-now {

            .btn-play-now:hover {

            .btn-close-details {

        </style>
    </head>

        <!-- Header -->

            </div>
            <div class="user-info">
                <div class="controllers-status">
                    <div class="controller-indicator" id="player1Indicator">
                        <span class="controller-icon">🎮</span>
                        <span class="controller-label">P1</span>
                        <div class="controller-status-dot"></div>
                    </div>
                    <div class="controller-indicator" id="player2Indicator">
                        <span class="controller-icon">🎮</span>
                        <span class="controller-label">P2</span>
                        <div class="controller-status-dot"></div>
                    </div>
                </div>
                <button class="controller-btn" id="controllerBtn">Controles</button>

        <!-- Controller Modal -->
        <div class="controller-modal" id="controllerModal">

                <div class="qr-container" id="qrContainer">
                    <img id="qrCodeImage" alt="QR Code">
                </div>
                
                <div class="controller-url" id="controllerURL">Carregando...</div>
                
                <div class="controller-status">

                        Jogador 1: Desconectado
                    </div>
                    <div class="player-status" id="player2Status">

                    </div>
                </div>
                
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">

                <button class="close-modal" id="closeModal">Fechar</button>
            </div>

        <!-- Game Details Modal -->
        <div class="game-details-modal" id="gameDetailsModal">
            <div class="game-details-content">
                <div class="game-details-header">
                    <img class="game-details-bg" id="detailsBgImage" src="" alt="">
                    <div class="game-details-overlay">
                        <div class="game-details-title" id="detailsTitle">Título do Jogo</div>
                        <div class="game-details-meta" id="detailsMeta"></div>
                    </div>
                </div>

                <div class="game-details-body">
                    <div class="details-section">
                        <div class="details-section-title">📝 Descrição</div>
                        <div class="details-section-content" id="detailsDescription"></div>
                    </div>

                    <div class="details-section">
                        <div class="details-section-title">ℹ️ Informações</div>
                        <div class="details-info-grid" id="detailsInfoGrid"></div>
                    </div>
                </div>

                <div class="game-details-actions">
                    <button class="btn-play-now" id="btnPlayNow">
                        🎮 Jogar Agora
                    </button>
                    <button class="btn-close-details" id="btnCloseDetails">
                        Fechar
                    </button>
                </div>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            // Verificar autenticação
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                // Redirecionar para login se não estiver autenticado
                window.location.href = 'login.html';
            }

            // Parse dos dados do usuário
            let currentUser = null;
            try {
                currentUser = JSON.parse(userData);
                console.log('👤 Usuário logado:', currentUser.nome, currentUser.premium ? '⭐ PREMIUM' : '');
            } catch (error) {
                console.error('Erro ao carregar dados do usuário:', error);
                localStorage.removeItem('arcadeUser');
                window.location.href = 'login.html';
            }

            // Proteção leve contra erros específicos do EmulatorJS
            window.addEventListener('error', function(e) {
                // Apenas capturar erros conhecidos e específicos
                if (e.message && (
                    (e.message.includes('Cannot read properties of null') && e.message.includes('classList')) ||
                    e.message.includes('Could not get screen dimensions')
                )) {
                    console.warn('⚠️ Erro EmulatorJS capturado e ignorado:', e.message);
                    e.preventDefault();
                    return true;
                }
            }, true);

            window.addEventListener('unhandledrejection', function(e) {
                console.warn('⚠️ Promise rejeitada:', e.reason);
            });

            // Estado da aplicação
            let jogos = [];
            let currentIndex = 0;
            let isGameRunning = false;
            let socket = null;

            // Mapear teclas do controle virtual para EmulatorJS
            // Player 1: z, x, a, s, enter, direções (ArrowUp/Down/Left/Right)
            // Player 2: j, k, l, m, 1, 2, 8, 5, 4, 6
            const keyMappingPlayer1 = {
                'up': 'ArrowUp',
                'down': 'ArrowDown',
                'left': 'ArrowLeft',
                'right': 'ArrowRight',
                'a': 'KeyX',        // X
                'b': 'KeyZ',        // Z
                'x': 'KeyS',        // S
                'y': 'KeyA',        // A
                'start': 'Enter',   // Enter
                'select': 'ShiftRight', // Shift
                'coin': 'KeyV'      // V (Inserir Ficha)
            };

            const keyMappingPlayer2 = {
                'up': 'Digit8',     // 8
                'down': 'Digit5',   // 5
                'left': 'Digit4',   // 4
                'right': 'Digit6',  // 6
                'a': 'KeyK',        // K
                'b': 'KeyJ',        // J
                'x': 'KeyM',        // M
                'y': 'KeyL',        // L
                'start': 'Digit2',  // 2
                'select': 'Digit1', // 1
                'coin': 'KeyV'      // V (Inserir Ficha)
            };

            // Elementos do DOM
            const carouselTrack = document.getElementById('carouselTrack');
            const gameDetails = document.getElementById('gameDetails');
            const gameBackgrounds = document.getElementById('gameBackgrounds');
            const display = document.getElementById('display');
            const loading = document.getElementById('loading');
            const backButton = document.getElementById('backButton');
            const mainContainer = document.getElementById('mainContainer');
            const gameCount = document.getElementById('gameCount');
            const controllerBtn = document.getElementById('controllerBtn');
            const controllerModal = document.getElementById('controllerModal');
            const closeModal = document.getElementById('closeModal');
            const qrCodeImage = document.getElementById('qrCodeImage');
            const controllerURL = document.getElementById('controllerURL');
            const player1Status = document.getElementById('player1Status');
            const player2Status = document.getElementById('player2Status');
            const userAvatar = document.getElementById('userAvatar');
            const player1Indicator = document.getElementById('player1Indicator');
            const player2Indicator = document.getElementById('player2Indicator');
            
            // Atualizar informações do usuário no header
            if (currentUser) {
                const initials = currentUser.nome.substring(0, 2).toUpperCase();
                userAvatar.textContent = initials;
                userAvatar.title = `${currentUser.nome} - Clique para sair`;
                
                if (currentUser.premium) {
                    userAvatar.style.background = 'linear-gradient(135deg, #ffd700, #ffed4e)';
                    userAvatar.style.color = '#0d0d0d';
                    userAvatar.title += ' ⭐ PREMIUM';
                }
            }
            
            // Logout
            userAvatar.addEventListener('click', () => {
                if (confirm(`Deseja sair, ${currentUser.nome}?`)) {
                    localStorage.removeItem('arcadeUser');
                    window.location.href = 'login.html';
                }
            });
            
            // Elementos do modal de detalhes do jogo
            const gameDetailsModal = document.getElementById('gameDetailsModal');
            const detailsBgImage = document.getElementById('detailsBgImage');
            const detailsTitle = document.getElementById('detailsTitle');
            const detailsMeta = document.getElementById('detailsMeta');
            const detailsDescription = document.getElementById('detailsDescription');
            const detailsInfoGrid = document.getElementById('detailsInfoGrid');
            const btnPlayNow = document.getElementById('btnPlayNow');
            const btnCloseDetails = document.getElementById('btnCloseDetails');

            // Inicializar Socket.IO com dados do usuário
            function initSocket() {
                socket = io({
                    auth: {
                        usuario: currentUser.usuario,
                        nome: currentUser.nome,
                        sessionId: currentUser.sessionId,
                        premium: currentUser.premium
                    }
                });

                socket.on('connect', () => {
                    console.log('✅ Conectado ao servidor Socket.IO');
                    socket.emit('register-screen', {
                        usuario: currentUser.usuario,
                        nome: currentUser.nome,
                        sessionId: currentUser.sessionId
                    });
                });

                socket.on('controller-connected', (data) => {
                    console.log(`✅ Jogador ${data.player} conectado`);
                    updatePlayerStatus(data.player, true);
                });

                socket.on('controller-disconnected', (data) => {
                    console.log(`❌ Jogador ${data.player} desconectado`);
                    updatePlayerStatus(data.player, false);
                });

                socket.on('close-game', () => {
                    console.log('🔙 Controle solicitou voltar ao menu');
                    closeGame();
                });

                socket.on('enter-fullscreen', () => {
                    console.log('📺 Controle solicitou entrar em tela cheia');
                    enterFullscreen();
                });

                socket.on('exit-fullscreen', () => {
                    console.log('📺 Controle solicitou sair da tela cheia');
                    exitFullscreen();
                });

                socket.on('game-input', (data) => {
                    console.log('🎮 Recebido input:', data);
                    handleControllerInput(data);
                });

                socket.on('controllers-status', (data) => {
                    updatePlayerStatus(1, data.player1);
                    updatePlayerStatus(2, data.player2);
                });
            }

            // Atualizar status do jogador
            function updatePlayerStatus(player, connected) {
                const statusEl = player === 1 ? player1Status : player2Status;
                const indicatorEl = player === 1 ? player1Indicator : player2Indicator;
                
                if (connected) {
                    statusEl.textContent = `Jogador ${player}: Conectado ✓`;
                    statusEl.classList.add('connected');
                    indicatorEl.classList.add('connected');
                } else {
                    statusEl.textContent = `Jogador ${player}: Desconectado`;
                    statusEl.classList.remove('connected');
                    indicatorEl.classList.remove('connected');
                }
            }

            // Processar input do controle
            function handleControllerInput(data) {
                // Selecionar o mapeamento correto baseado no jogador
                const keyMapping = data.player === 1 ? keyMappingPlayer1 : keyMappingPlayer2;
                const mappedKey = keyMapping[data.key];
                if (!mappedKey) {
                    console.warn('⚠️ Tecla não mapeada:', data.key);
                    return;
                }

                const keyCode = getKeyCode(mappedKey);
                const eventType = data.pressed ? 'keydown' : 'keyup';
                
                console.log(`🎯 P${data.player}: ${data.key} -> ${mappedKey} (keyCode: ${keyCode}) [${eventType}]`);

                // Método 1: Evento KeyboardEvent moderno
                try {
                    const keyEvent = new KeyboardEvent(eventType, {
                        key: getKeyName(mappedKey),
                        code: mappedKey,
                        keyCode: keyCode,
                        which: keyCode,
                        bubbles: true,
                        cancelable: true,
                        composed: true,
                        view: window
                    });

                    // Disparar em múltiplos alvos
                    const gameElement = document.getElementById('game');
                    const canvas = gameElement?.querySelector('canvas');
                    const iframe = gameElement?.querySelector('iframe');
                    
                    if (canvas) {
                        canvas.dispatchEvent(keyEvent);
                        console.log('📤 Evento enviado para canvas');
                    }
                    if (iframe) {
                        try {
                            iframe.contentWindow.document.dispatchEvent(keyEvent);
                            console.log('📤 Evento enviado para iframe');
                        } catch (e) {
                            console.log('⚠️ Não foi possível acessar iframe');
                        }
                    }
                    
                    gameElement?.dispatchEvent(keyEvent);
                    document.dispatchEvent(keyEvent);
                    window.dispatchEvent(keyEvent);
                    
                } catch (e) {
                    console.error('❌ Erro ao criar evento:', e);
                }

                // Método 2: Evento legado (para compatibilidade)
                try {
                    const event = document.createEvent('KeyboardEvent');
                    const initMethod = typeof event.initKeyboardEvent !== 'undefined' ? 
                        'initKeyboardEvent' : 'initKeyEvent';
                    
                    event[initMethod](
                        eventType, true, true, window, 0, 0, 0, 0, keyCode, keyCode
                    );
                    
                    document.dispatchEvent(event);
                } catch (e) {
                    // Silencioso - método alternativo
                }
            }

            // Obter nome da tecla
            function getKeyName(code) {
                const keyNameMap = {
                    'ArrowUp': 'ArrowUp',
                    'ArrowDown': 'ArrowDown',
                    'ArrowLeft': 'ArrowLeft',
                    'ArrowRight': 'ArrowRight',
                    'KeyX': 'x',
                    'KeyZ': 'z',
                    'KeyA': 'a',
                    'KeyS': 's',
                    'KeyJ': 'j',
                    'KeyK': 'k',
                    'KeyL': 'l',
                    'KeyM': 'm',
                    'KeyV': 'v',
                    'Enter': 'Enter',
                    'ShiftRight': 'Shift',
                    'Digit1': '1',
                    'Digit2': '2',
                    'Digit4': '4',
                    'Digit5': '5',
                    'Digit6': '6',
                    'Digit8': '8'
                };
                return keyNameMap[code] || code;
            }

            // Obter keyCode para compatibilidade
            function getKeyCode(code) {
                const keyCodeMap = {
                    'ArrowUp': 38,
                    'ArrowDown': 40,
                    'ArrowLeft': 37,
                    'ArrowRight': 39,
                    'KeyX': 88,
                    'KeyZ': 90,
                    'KeyA': 65,
                    'KeyS': 83,
                    'KeyJ': 74,
                    'KeyK': 75,
                    'KeyL': 76,
                    'KeyM': 77,
                    'KeyV': 86,
                    'Enter': 13,
                    'ShiftRight': 16,
                    'Digit1': 49,
                    'Digit2': 50,
                    'Digit4': 52,
                    'Digit5': 53,
                    'Digit6': 54,
                    'Digit8': 56
                };
                return keyCodeMap[code] || 0;
            }

            // Abrir modal de controles
            controllerBtn.onclick = async () => {
                controllerModal.classList.add('active');
                
                // Carregar QR Code com sessionId do usuário
                try {
                    const response = await fetch(`/qrcode?sessionId=${currentUser.sessionId}`);
                    const data = await response.json();
                    qrCodeImage.src = data.qrcode;
                    controllerURL.textContent = data.url;
                    console.log('🔗 QR Code gerado para sessão:', data.sessionId);
                } catch (error) {
                    console.error('Erro ao carregar QR Code:', error);
                    controllerURL.textContent = 'Erro ao gerar QR Code';
                }
            };

            // Fechar modal
            closeModal.onclick = () => {
                controllerModal.classList.remove('active');
            };

            // Fechar modal ao clicar fora
            controllerModal.onclick = (e) => {
                if (e.target === controllerModal) {
                    controllerModal.classList.remove('active');
                }
            };

            // Teste de áudio
            const testAudioBtn = document.getElementById('testAudioBtn');
            testAudioBtn.onclick = () => {
                console.log('🔊 Gerando áudio de teste...');
                
                // Criar um tom de teste usando Web Audio API
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                const destination = audioCtx.createMediaStreamDestination();
                
                // Configurar oscilador (tom de 440Hz - nota Lá)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                
                // Configurar volume
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                
                // Conectar
                oscillator.connect(gainNode);
                gainNode.connect(destination);
                gainNode.connect(audioCtx.destination); // Também tocar localmente
                
                // Criar MediaRecorder
                const mediaRecorder = new MediaRecorder(destination.stream, {
                    mimeType: 'audio/webm;codecs=opus',
                    audioBitsPerSecond: 96000
                });
                
                const audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    // Combinar chunks em um único blob
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                    
                    // Converter para base64
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64 = reader.result.split(',')[1];
                        
                        // Enviar para o servidor
                        if (socket && socket.connected) {
                            socket.emit('test-audio', base64);
                            console.log('✅ Áudio de teste enviado para controles');
                            
                            // Feedback visual
                            testAudioBtn.textContent = '✅ Enviado!';
                            setTimeout(() => {
                                testAudioBtn.textContent = '🔊 Testar Áudio';
                            }, 2000);
                        }
                    };
                    reader.readAsDataURL(audioBlob);
                };
                
                // Iniciar gravação
                mediaRecorder.start();
                
                // Tocar por 1 segundo
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                    mediaRecorder.stop();
                    audioCtx.close();
                }, 1000);
            };

            // Atualizar relógio
            function updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
            }
            updateTime();
            setInterval(updateTime, 60000);

            // Carregar jogos do JSON
            async function loadGames() {
                try {
                    const response = await fetch('jogosdisponiveis.json');
                    const data = await response.json();
                    jogos = data.jogos;
                    gameCount.textContent = `${jogos.length} JOGOS`;
                    renderGames();
                    selectGame(0);
                } catch (error) {
                    console.error('Erro ao carregar jogos:', error);
                }
            }

            // Renderizar jogos no carrossel
            function renderGames() {
                carouselTrack.innerHTML = '';
                gameBackgrounds.innerHTML = '';

                jogos.forEach((jogo, index) => {
                    // Card do jogo
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.dataset.index = index;
                    card.innerHTML = `
                        <img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.src='docs/Logo-light.png'">
                        <div class="game-card-title">${jogo.nome}</div>
                    `;
                    card.onclick = () => selectGame(index);
                    carouselTrack.appendChild(card);

                    // Background do jogo
                    const bg = document.createElement('div');
                    bg.className = 'game-background';
                    bg.dataset.index = index;
                    
                    // Tentar usar vídeo primeiro, se não existir usar imagem
                    if (jogo.video) {
                        bg.innerHTML = `<video autoplay loop muted><source src="${jogo.video}" type="video/mp4"></video>`;
                    } else {
                        bg.innerHTML = `<img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.style.display='none'">`;
                    }
                    
                    gameBackgrounds.appendChild(bg);
                });
            }

            // Selecionar jogo
            function selectGame(index) {
                if (index < 0 || index >= jogos.length) return;
                
                currentIndex = index;
                const jogo = jogos[index];

                // Atualizar cards
                document.querySelectorAll('.game-card').forEach((card, i) => {
                    card.classList.toggle('selected', i === index);
                });

                // Atualizar backgrounds
                document.querySelectorAll('.game-background').forEach((bg, i) => {
                    bg.classList.toggle('active', i === index);
                });

                // Atualizar detalhes
                gameDetails.classList.remove('active');
                setTimeout(() => {
                    gameDetails.innerHTML = `
                        <div class="game-title">${jogo.nome}</div>
                        <div class="game-meta">
                            <span>🎮 ${jogo.plataforma.toUpperCase()}</span>
                            <span>📅 ${jogo.ano}</span>
                            <span>👥 ${jogo.jogadores}</span>
                            <span>${jogo.genero}</span>
                        </div>
                        <div class="game-description">${jogo.descricao}</div>
                        <div class="game-actions">
                            <button class="btn btn-primary" onclick="playGame()">
                                ▶ Jogar Agora
                            </button>
                            <button class="btn btn-secondary" onclick="showInfo()">
                                ℹ️ Mais Informações
                            </button>
                        </div>
                    `;
                    gameDetails.classList.add('active');
                }, 100);

                // Centralizar no carrossel
                centerCarousel();
            }

            // Centralizar carrossel no jogo selecionado
            function centerCarousel() {
                const cardWidth = 200 + 25; // largura + gap
                const offset = currentIndex * cardWidth;
                const containerCenter = window.innerWidth / 2;
                const cardCenter = cardWidth / 2;
                const translation = containerCenter - cardCenter - offset - 80; // 80 é o padding
                carouselTrack.style.transform = `translateX(${translation}px)`;
            }

            // Navegação do carrossel
            document.getElementById('navLeft').onclick = () => {
                if (currentIndex > 0) {
                    selectGame(currentIndex - 1);
                }
            };

            document.getElementById('navRight').onclick = () => {
                if (currentIndex < jogos.length - 1) {
                    selectGame(currentIndex + 1);
                }
            };

            // Navegação por teclado
            document.addEventListener('keydown', (e) => {
                if (isGameRunning) return;

                switch(e.key) {
                    case 'ArrowLeft':
                        if (currentIndex > 0) selectGame(currentIndex - 1);
                        break;
                    case 'ArrowRight':
                        if (currentIndex < jogos.length - 1) selectGame(currentIndex + 1);
                        break;
                    case 'Enter':
                        playGame();
                        break;
                    case 'Escape':
                        if (isGameRunning) stopGame();
                        break;
                }
            });

            // Mostrar informações do jogo no modal
            function showInfo() {
                const jogo = jogos[currentIndex];
                
                // Preencher imagem de fundo
                detailsBgImage.src = jogo.imagem;
                
                // Preencher título
                detailsTitle.textContent = jogo.nome;
                
                // Preencher meta tags
                detailsMeta.innerHTML = `

            btnPlayNow.addEventListener('click', () => {

            btnCloseDetails.addEventListener('click', () => {
                gameDetailsModal.classList.remove('active');
            });
            
            // Fechar modal ao clicar fora do conteúdo
            gameDetailsModal.addEventListener('click', (e) => {
                if (e.target === gameDetailsModal) {
                    gameDetailsModal.classList.remove('active');
                }
            });

            // Jogar jogo
            async function playGame() {
                const jogo = jogos[currentIndex];
                
                loading.classList.add('active');
                mainContainer.style.display = 'none';
                
                setTimeout(() => {
                    runEmulator(jogo);
                }, 500);
            }

            // Executar emulador
            function runEmulator(jogo) {
                isGameRunning = true;
                display.classList.add('active');
                backButton.classList.add('active');
                loading.classList.remove('active');

                // Limpar emulador anterior se existir
                const gameDiv = document.getElementById('game');
                gameDiv.innerHTML = '';

                // Limpar variáveis globais do EmulatorJS para evitar redeclarações
                if (window.EJS_emulator) {
                    try {
                        window.EJS_emulator.destroy?.();
                    } catch (e) {
                        console.warn('Erro ao destruir emulador:', e);
                    }
                }
                
                // Limpar variáveis globais
                delete window.EmulatorJS;
                delete window.EJS_STORAGE;
                delete window.GamepadHandler;
                delete window.EJS_GameManager;
                delete window.EJSCompression;
                delete window.EJS_emulator;

                // Configurar EmulatorJS
                window.EJS_player = "#game";
                window.EJS_gameName = jogo.nome;
                window.EJS_biosUrl = jogo.configuracoes.biosUrl || "";
                window.EJS_gameUrl = jogo.arquivo;
                window.EJS_core = jogo.configuracoes.core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = jogo.configuracoes.debug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = jogo.configuracoes.threads;

                console.log('🎮 Configuração EmulatorJS:', {
                    player: window.EJS_player,
                    game: window.EJS_gameName,
                    gameUrl: window.EJS_gameUrl,
                    core: window.EJS_core,
                    biosUrl: window.EJS_biosUrl
                });

                // Remover scripts antigos do EmulatorJS
                const oldScripts = document.querySelectorAll('script[src^="data/"]');
                oldScripts.forEach(script => {
                    script.remove();
                    console.log('🗑️ Script removido:', script.src);
                });

                // Carregar EmulatorJS
                const script = document.createElement('script');
                script.src = "data/loader.js";
                script.onload = function() {
                    console.log('✅ EmulatorJS loader.js carregado');
                    
                    // Patch para evitar erro de dimensões da tela
                    window.addEventListener('error', (e) => {
                        if (e.message && e.message.includes('Could not get screen dimensions')) {
                            e.preventDefault();
                            console.log('⚠️ Erro de dimensões da tela ignorado');
                        }
                    });
                    
                    // Iniciar captura de áudio após carregar o emulador
                    setTimeout(() => {
                        startAudioCapture();
                    }, 3000);
                    
                    // Patch leve para handleResize (não bloqueia carregamento)
                    setTimeout(() => {
                        try {
                            if (window.EmulatorJS && window.EmulatorJS.prototype && window.EmulatorJS.prototype.handleResize) {
                                const originalHandleResize = window.EmulatorJS.prototype.handleResize;
                                window.EmulatorJS.prototype.handleResize = function() {
                                    try {
                                        if (this.game && this.game.parentElement) {
                                            originalHandleResize.call(this);
                                        }
                                    } catch (e) {
                                        // Silencioso
                                    }
                                };
                            }
                            
                            // Patch para Module._emscripten_get_screen_dimensions
                            if (window.Module) {
                                window.Module._emscripten_get_screen_dimensions = function() {
                                    return [window.innerWidth || 1920, window.innerHeight || 1080];
                                };
                            }
                        } catch (e) {
                            console.log('Patch não aplicado:', e.message);
                        }
                    }, 1000);
                };
                script.onerror = function(error) {
                    console.error('❌ Erro ao carregar EmulatorJS:', error);
                    loading.classList.add('active');
                    const loadingText = loading.querySelector('p');
                    if (loadingText) loadingText.textContent = 'Erro ao carregar emulador';
                };
                document.body.appendChild(script);
            }

            // Parar jogo e voltar ao menu
            function stopGame() {
                if (confirm('Deseja realmente sair do jogo? O progresso não salvo será perdido.')) {
                    isGameRunning = false;
                    display.classList.remove('active');
                    backButton.classList.remove('active');
                    mainContainer.style.display = 'block';
                    
                    // Parar captura de áudio
                    stopAudioCapture();
                    
                    // Limpar emulador
                    const gameDiv = document.getElementById('game');
                    gameDiv.innerHTML = '';
                    
                    // Remover script do loader
                    const script = document.querySelector('script[src="data/loader.js"]');
                    if (script) {
                        script.remove();
                    }

                    // Re-selecionar o jogo atual para recarregar o background
                    selectGame(currentIndex);
                }
            }

            // Fechar jogo (sem confirmação - usado pelo controle)
            function closeGame() {
                console.log('🔙 Fechando jogo...');
                isGameRunning = false;
                display.classList.remove('active');
                backButton.classList.remove('active');
                mainContainer.style.display = 'block';
                
                // Parar captura de áudio
                stopAudioCapture();
                
                // Limpar emulador
                const gameDiv = document.getElementById('game');
                gameDiv.innerHTML = '';
                
                // Remover script do loader
                const script = document.querySelector('script[src="data/loader.js"]');
                if (script) {
                    script.remove();
                }

                // Re-selecionar o jogo atual para recarregar o background
                selectGame(currentIndex);
                
                console.log('✅ Jogo fechado, voltando ao menu');
            }

            // Funções de Fullscreen
            function enterFullscreen() {
                const elem = document.documentElement;
                
                if (document.fullscreenElement || 
                    document.webkitFullscreenElement || 
                    document.mozFullScreenElement || 
                    document.msFullscreenElement) {
                    console.log('✅ Já está em tela cheia');
                    return;
                }
                
                console.log('📺 Entrando em tela cheia...');
                
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.error('❌ Erro ao entrar em fullscreen:', err);
                    });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                } else {
                    console.error('❌ Fullscreen não suportado');
                }
            }

            function exitFullscreen() {
                if (!document.fullscreenElement && 
                    !document.webkitFullscreenElement && 
                    !document.mozFullScreenElement && 
                    !document.msFullscreenElement) {
                    console.log('✅ Já está fora da tela cheia');
                    return;
                }
                
                console.log('📺 Saindo da tela cheia...');
                
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }

            // Captura de áudio
            let audioStream = null;
            let audioContext = null;
            let audioProcessor = null;
            let mediaRecorder = null;
            let audioDestination = null;

            function startAudioCapture() {
                try {
                    console.log('🎵 Iniciando captura de áudio do EmulatorJS...');
                    
                    // Aguardar o EmulatorJS criar o AudioContext
                    const checkEmulatorAudio = () => {
                        // Procurar pelo AudioContext do EmulatorJS
                        if (window.EJS_emulator && window.EJS_emulator.audioContext) {
                            console.log('✅ AudioContext do EmulatorJS encontrado!');
                            captureFromEmulatorContext(window.EJS_emulator.audioContext);
                            return;
                        }
                        
                        // Tentar encontrar qualquer AudioContext ativo
                        const contexts = [];
                        
                        // Chrome/Edge expõem AudioContext instances
                        if (window.webkitAudioContext && window.webkitAudioContext.prototype) {
                            contexts.push(...Object.values(window).filter(v => v instanceof AudioContext || v instanceof webkitAudioContext));
                        }
                        
                        if (contexts.length > 0) {
                            console.log(`✅ Encontrado ${contexts.length} AudioContext(s) ativo(s)`);
                            captureFromEmulatorContext(contexts[0]);
                            return;
                        }
                        
                        console.log('⏳ Aguardando AudioContext do EmulatorJS...');
                        setTimeout(checkEmulatorAudio, 1000);
                    };
                    
                    checkEmulatorAudio();
                    
                } catch (error) {
                    console.error('❌ Erro ao iniciar captura de áudio:', error);
                }
            }

            function captureFromEmulatorContext(emulatorAudioContext) {
                try {
                    console.log('🎯 Capturando áudio do contexto:', emulatorAudioContext);
                    
                    // Criar nosso próprio AudioContext para processar
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Criar destination para captura
                    audioDestination = audioContext.createMediaStreamDestination();
                    
                    // Tentar conectar ao destination do emulador
                    if (emulatorAudioContext.destination) {
                        try {
                            // Criar um gain node para interceptar o áudio
                            const gainNode = emulatorAudioContext.createGain();
                            gainNode.gain.value = 1.0;
                            
                            // Redirecionar a saída do emulador através do nosso gain
                            // (isso pode não funcionar devido a restrições de segurança)
                            console.log('🔌 Tentando conectar ao destination do emulador...');
                            
                        } catch (err) {
                            console.log('⚠️ Não foi possível conectar diretamente:', err.message);
                        }
                    }
                    
                    // Método alternativo: usar captureStream da aba/janela
                    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                        console.log('🎤 Solicitando captura de áudio da aba...');
                        console.log('💡 IMPORTANTE: Selecione a aba atual e marque "Compartilhar áudio da aba"');
                        
                        navigator.mediaDevices.getDisplayMedia({
                            video: false,
                            audio: {
                                echoCancellation: false,
                                noiseSuppression: false,
                                autoGainControl: false,
                                sampleRate: 48000,
                                channelCount: 2
                            },
                            preferCurrentTab: true
                        }).then(stream => {
                            console.log('✅ Captura de áudio da aba iniciada com sucesso!');
                            console.log('📡 Áudio do jogo será transmitido para os controles');
                            audioStream = stream;
                            
                            // Criar MediaRecorder
                            const options = {
                                mimeType: 'audio/webm;codecs=opus',
                                audioBitsPerSecond: 96000
                            };
                            
                            mediaRecorder = new MediaRecorder(stream, options);
                            
                            mediaRecorder.ondataavailable = (event) => {
                                if (event.data.size > 0) {
                                    // Converter para base64 e enviar
                                    const reader = new FileReader();
                                    reader.onloadend = () => {
                                        const base64 = reader.result.split(',')[1];
                                        if (socket && socket.connected) {
                                            socket.emit('game-audio', base64);
                                        }
                                    };
                                    reader.readAsDataURL(event.data);
                                }
                            };
                            
                            mediaRecorder.onerror = (error) => {
                                console.error('❌ Erro no MediaRecorder:', error);
                            };
                            
                            // Iniciar gravação com chunks de 200ms
                            mediaRecorder.start(200);
                            console.log('🎙️ MediaRecorder iniciado - Transmitindo áudio da janela');
                            
                        }).catch(err => {
                            console.error('❌ Erro ao solicitar captura de áudio:', err);
                            console.log('');
                            console.log('═══════════════════════════════════════════════════════');
                            console.log('💡 COMO COMPARTILHAR O ÁUDIO DO JOGO:');
                            console.log('');
                            console.log('1. Um popup deve aparecer perguntando qual conteúdo compartilhar');
                            console.log('2. Selecione a ABA ATUAL (onde o jogo está rodando)');
                            console.log('3. MARQUE a opção "Compartilhar áudio da aba" ✓');
                            console.log('4. Clique em "Compartilhar"');
                            console.log('5. No celular, clique no botão � para ativar o áudio');
                            console.log('');
                            console.log('⚠️  Sem compartilhar o áudio da aba, o som NÃO será transmitido!');
                            console.log('═══════════════════════════════════════════════════════');
                        });
                    } else {
                        console.error('❌ API getDisplayMedia não disponível neste navegador');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro ao capturar do contexto:', error);
                }
            }

            function tryAlternativeCapture() {
                console.log('🔄 Método de captura não implementado (não é necessário)');
            }

            function stopAudioCapture() {
                console.log('🛑 Parando captura de áudio...');
                
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder = null;
                }
                if (audioStream) {
                    audioStream.getTracks().forEach(track => track.stop());
                    audioStream = null;
                }
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                    audioContext = null;
                }
                audioDestination = null;
                console.log('🔇 Captura de áudio parada');
            }

            // Botão de voltar
            backButton.onclick = stopGame;

            // Redimensionar janela
            window.addEventListener('resize', () => {
                if (!isGameRunning) {
                    centerCarousel();
                }
            });

            // Inicializar
            initSocket();
            loadGames();
        </script>
