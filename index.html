<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Arcade Station</title>
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body, html {
                height: 100%;
                width: 100%;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
                background: #0a0a0a;
                color: #e8e8e8;
            }

            /* Background elegante */
            .background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0a0a0a 100%);
                z-index: -1;
                overflow: hidden;
            }

            .background::before {
                content: '';
                position: absolute;
                width: 100%;
                height: 100%;
                background: 
                    linear-gradient(90deg, rgba(100,100,120,0.03) 1px, transparent 1px),
                    linear-gradient(0deg, rgba(100,100,120,0.03) 1px, transparent 1px);
                background-size: 60px 60px;
                opacity: 0.3;
            }

            .background::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle at 50% 50%, rgba(75, 85, 180, 0.15) 0%, transparent 50%);
                animation: backgroundPulse 20s ease-in-out infinite;
            }

            @keyframes backgroundPulse {
                0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
                50% { transform: translate(-10%, -10%) scale(1.1); opacity: 0.5; }
            }

            /* Header minimalista e elegante */
            .header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 70px;
                background: rgba(13, 13, 13, 0.85);
                backdrop-filter: blur(30px) saturate(180%);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 50px;
                z-index: 100;
                border-bottom: 1px solid rgba(75, 85, 180, 0.25);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 30px;
            }

            .logo {
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.5px;
                color: #e8e8e8;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo::before {
                content: '◆';
                font-size: 16px;
                color: #5b6bc0;
            }

            .time {
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.5);
                letter-spacing: 1px;
                font-variant-numeric: tabular-nums;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .user-info span {
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.6);
                letter-spacing: 0.5px;
            }

            .user-avatar {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: linear-gradient(135deg, #5b6bc0 0%, #4a5a99 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 14px;
                border: 2px solid rgba(75, 85, 180, 0.4);
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .user-avatar:hover {
                transform: scale(1.05);
                border-color: rgba(75, 85, 180, 0.7);
                box-shadow: 0 0 20px rgba(75, 85, 180, 0.5);
            }

            /* Container principal */
            .main-container {
                position: relative;
                width: 100%;
                height: calc(100% - 60px);
                margin-top: 60px;
                overflow: hidden;
            }

            /* Background de vídeo/imagem do jogo */
            .game-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 0.5s ease;
                overflow: hidden;
            }

            .game-background.active {
                opacity: 1;
            }

            .game-background::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, 
                    rgba(13,13,13,0.5) 0%, 
                    rgba(13,13,13,0.85) 50%, 
                    rgba(10,10,10,0.98) 100%);
            }

            .game-background img,
            .game-background video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(20px) brightness(0.35) saturate(1.1);
            }

            /* Detalhes do jogo selecionado */
            .game-details {
                position: absolute;
                bottom: 400px;
                left: 80px;
                max-width: 650px;
                z-index: 10;
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .game-details.active {
                opacity: 1;
                transform: translateY(0);
            }

            .game-title {
                font-size: 56px;
                font-weight: 700;
                margin-bottom: 20px;
                text-shadow: 0 4px 30px rgba(0,0,0,0.9);
                letter-spacing: -1px;
                line-height: 1.1;
                color: #e8e8e8;
            }

            .game-meta {
                display: flex;
                gap: 15px;
                margin-bottom: 25px;
                font-size: 12px;
            }

            .game-meta span {
                padding: 6px 14px;
                background: rgba(75, 85, 180, 0.18);
                border: 1px solid rgba(75, 85, 180, 0.35);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                font-weight: 500;
                color: rgba(220, 220, 230, 0.85);
                letter-spacing: 0.5px;
                transition: all 0.3s ease;
            }

            .game-meta span:hover {
                background: rgba(75, 85, 180, 0.28);
                border-color: rgba(75, 85, 180, 0.55);
            }

            .game-description {
                font-size: 15px;
                line-height: 1.7;
                color: rgba(200, 200, 210, 0.75);
                margin-bottom: 35px;
                text-shadow: 0 2px 10px rgba(0,0,0,0.6);
                font-weight: 300;
                max-width: 550px;
            }

            .game-actions {
                display: flex;
                gap: 15px;
            }

            .btn {
                padding: 14px 32px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                align-items: center;
                gap: 10px;
                letter-spacing: 0.3px;
                position: relative;
                overflow: hidden;
            }

            .btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
                transition: left 0.5s ease;
            }

            .btn:hover::before {
                left: 100%;
            }

            .btn-primary {
                background: linear-gradient(135deg, #5b6bc0 0%, #3f51b5 100%);
                color: #ffffff;
                box-shadow: 0 4px 15px rgba(75, 85, 180, 0.45);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.65);
            }

            .btn-primary:active {
                transform: translateY(0);
            }

            .btn-secondary {
                background: rgba(100, 100, 120, 0.08);
                color: rgba(220, 220, 230, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(100, 100, 120, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(100, 100, 120, 0.15);
                border-color: rgba(100, 100, 120, 0.35);
                transform: translateY(-2px);
            }

            /* Carrossel de jogos elegante */
            .games-carousel {
                position: absolute;
                bottom: 50px;
                left: 0;
                right: 0;
                height: 320px;
                display: flex;
                align-items: center;
                z-index: 20;
                padding: 0 80px;
                overflow: visible;
            }

            .carousel-track {
                display: flex;
                gap: 25px;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                padding: 20px 0;
            }

            .game-card {
                min-width: 200px;
                height: 280px;
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                position: relative;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                border: 2px solid rgba(75, 85, 180, 0);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            }

            .game-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, 
                    transparent 0%, 
                    rgba(13,13,13,0.4) 60%,
                    rgba(10,10,10,0.92) 100%);
                z-index: 1;
                transition: opacity 0.3s ease;
            }

            .game-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                filter: brightness(0.8) saturate(1.05) contrast(1.05);
            }

            .game-card-title {
                position: absolute;
                bottom: 15px;
                left: 15px;
                right: 15px;
                font-size: 13px;
                font-weight: 600;
                z-index: 2;
                text-shadow: 0 2px 8px rgba(0,0,0,0.95);
                opacity: 0;
                transition: all 0.3s ease;
                letter-spacing: 0.3px;
                line-height: 1.3;
                color: #e8e8e8;
            }

            .game-card.selected {
                transform: scale(1.15) translateY(-20px);
                border-color: rgba(75, 85, 180, 0.85);
                box-shadow: 
                    0 20px 50px rgba(0, 0, 0, 0.9),
                    0 0 40px rgba(75, 85, 180, 0.35);
                z-index: 10;
            }

            .game-card.selected::before {
                background: linear-gradient(to bottom, 
                    transparent 0%, 
                    rgba(75, 85, 180, 0.12) 60%,
                    rgba(10,10,10,0.88) 100%);
            }

            .game-card.selected img {
                transform: scale(1.05);
                filter: brightness(0.95) saturate(1.2) contrast(1.1);
            }

            .game-card.selected .game-card-title {
                opacity: 1;
                transform: translateY(-5px);
            }

            .game-card:hover:not(.selected) {
                transform: scale(1.05) translateY(-8px);
                border-color: rgba(75, 85, 180, 0.35);
            }

            /* Navegação do carrossel */
            .carousel-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(75, 85, 180, 0.18);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(75, 85, 180, 0.35);
                width: 45px;
                height: 45px;
                border-radius: 12px;
                color: rgba(220, 220, 230, 0.9);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 30;
                font-size: 18px;
            }

            .carousel-nav:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
                transform: translateY(-50%) scale(1.08);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.45);
            }

            .carousel-nav:active {
                transform: translateY(-50%) scale(0.95);
            }

            .carousel-nav.left {
                left: 20px;
            }

            .carousel-nav.right {
                right: 20px;
            }

            /* Display do emulador */
            #display {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
                display: none;
                background: black;
            }

            #display.active {
                display: block;
            }

            #game {
                width: 100%;
                height: 100%;
            }

            /* Loading elegante */
            .loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 2000;
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .loading.active {
                display: flex;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(75, 85, 180, 0.25);
                border-top-color: #5b6bc0;
                border-radius: 50%;
                animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .loading::after {
                content: 'Carregando...';
                font-size: 13px;
                font-weight: 300;
                color: rgba(200, 200, 210, 0.6);
                letter-spacing: 1px;
            }

            /* Botão de voltar */
            .back-button {
                position: fixed;
                top: 85px;
                left: 30px;
                z-index: 1001;
                background: rgba(75, 85, 180, 0.18);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(75, 85, 180, 0.35);
                color: rgba(220, 220, 230, 0.9);
                padding: 12px 24px;
                border-radius: 10px;
                cursor: pointer;
                display: none;
                transition: all 0.3s ease;
                font-weight: 600;
                font-size: 13px;
                letter-spacing: 0.3px;
            }

            .back-button.active {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .back-button:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(75, 85, 180, 0.45);
            }

            .back-button:active {
                transform: translateY(0);
            }

            /* Responsivo */
            @media (max-width: 768px) {
                .game-title {
                    font-size: 36px;
                }

                .game-details {
                    left: 30px;
                    right: 30px;
                    bottom: 300px;
                    max-width: none;
                }

                .games-carousel {
                    padding: 0 30px;
                    height: 250px;
                }

                .game-card {
                    min-width: 160px;
                    height: 220px;
                }

                .header {
                    padding: 0 30px;
                    height: 60px;
                }

                .logo {
                    font-size: 18px;
                }
            }

            /* Controller Modal */
            .controller-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(20px);
                z-index: 500;
                display: none;
                align-items: center;
                justify-content: center;
                animation: fadeIn 0.3s ease;
            }

            .controller-modal.active {
                display: flex;
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            .modal-content {
                background: rgba(26, 26, 26, 0.95);
                border: 1px solid rgba(75, 85, 180, 0.3);
                border-radius: 16px;
                padding: 40px;
                max-width: 500px;
                width: 90%;
                text-align: center;
            }

            .modal-title {
                font-size: 24px;
                font-weight: 700;
                color: #e8e8e8;
                margin-bottom: 10px;
            }

            .modal-subtitle {
                font-size: 14px;
                color: rgba(200, 200, 210, 0.6);
                margin-bottom: 30px;
            }

            .qr-container {
                background: white;
                padding: 20px;
                border-radius: 12px;
                display: inline-block;
                margin-bottom: 20px;
            }

            .qr-container img {
                display: block;
                width: 250px;
                height: 250px;
            }

            .controller-url {
                font-size: 12px;
                color: #5b6bc0;
                margin-bottom: 25px;
                word-break: break-all;
                font-family: monospace;
            }

            .controller-status {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-bottom: 25px;
            }

            .player-status {
                padding: 10px 20px;
                background: rgba(75, 85, 180, 0.15);
                border: 1px solid rgba(75, 85, 180, 0.3);
                border-radius: 8px;
                font-size: 13px;
                font-weight: 600;
                color: rgba(200, 200, 210, 0.7);
            }

            .player-status.connected {
                background: rgba(76, 175, 80, 0.2);
                border-color: rgba(76, 175, 80, 0.5);
                color: #4caf50;
            }

            .close-modal {
                padding: 12px 32px;
                background: rgba(100, 100, 120, 0.15);
                border: 1px solid rgba(100, 100, 120, 0.3);
                border-radius: 8px;
                color: rgba(220, 220, 230, 0.9);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .close-modal:hover {
                background: rgba(100, 100, 120, 0.25);
                transform: translateY(-2px);
            }

            /* Controller Button in Header */
            .controller-btn {
                padding: 8px 18px;
                background: rgba(75, 85, 180, 0.2);
                border: 1px solid rgba(75, 85, 180, 0.35);
                border-radius: 8px;
                color: rgba(220, 220, 230, 0.9);
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .controller-btn:hover {
                background: rgba(75, 85, 180, 0.32);
                border-color: rgba(75, 85, 180, 0.6);
            }

            .controller-btn::before {
                content: '🎮';
                font-size: 16px;
            }
        </style>
    </head>

    <body>
        <div class="background"></div>

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">ARCADE STATION</div>
                <div class="time" id="currentTime"></div>
            </div>
            <div class="user-info">
                <button class="controller-btn" id="controllerBtn">Controles</button>
                <span id="gameCount">0 JOGOS</span>
                <div class="user-avatar">P1</div>
            </div>
        </div>

        <!-- Container Principal -->
        <div class="main-container" id="mainContainer">
            <!-- Backgrounds dos jogos -->
            <div id="gameBackgrounds"></div>

            <!-- Detalhes do jogo selecionado -->
            <div class="game-details" id="gameDetails"></div>

            <!-- Carrossel de jogos -->
            <div class="games-carousel">
                <button class="carousel-nav left" id="navLeft">◀</button>
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="carousel-nav right" id="navRight">▶</button>
            </div>
        </div>

        <!-- Display do emulador -->
        <div id="display">
            <div id="game"></div>
        </div>

        <!-- Botão de voltar -->
        <button class="back-button" id="backButton">
            ◀ Voltar ao menu
        </button>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <!-- Controller Modal -->
        <div class="controller-modal" id="controllerModal">
            <div class="modal-content">
                <div class="modal-title">🎮 Controles Virtuais</div>
                <div class="modal-subtitle">Escaneie o QR Code com seu celular</div>
                
                <div class="qr-container" id="qrContainer">
                    <img id="qrCodeImage" alt="QR Code">
                </div>
                
                <div class="controller-url" id="controllerURL">Carregando...</div>
                
                <div class="controller-status">
                    <div class="player-status" id="player1Status">
                        Jogador 1: Desconectado
                    </div>
                    <div class="player-status" id="player2Status">
                        Jogador 2: Desconectado
                    </div>
                </div>
                
                <button class="close-modal" id="closeModal">Fechar</button>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            // Proteção leve contra erros específicos do EmulatorJS
            window.addEventListener('error', function(e) {
                // Apenas capturar erros conhecidos e específicos
                if (e.message && e.message.includes('Cannot read properties of null') && e.message.includes('classList')) {
                    console.warn('⚠️ Erro handleResize capturado:', e.message);
                    e.preventDefault();
                    return true;
                }
            }, true);

            window.addEventListener('unhandledrejection', function(e) {
                console.warn('⚠️ Promise rejeitada:', e.reason);
            });

            // Estado da aplicação
            let jogos = [];
            let currentIndex = 0;
            let isGameRunning = false;
            let socket = null;

            // Mapear teclas do controle virtual para EmulatorJS
            // Player 1: z, x, a, s, enter, direções (ArrowUp/Down/Left/Right)
            // Player 2: j, k, l, m, 1, 2, 8, 5, 4, 6
            const keyMappingPlayer1 = {
                'up': 'ArrowUp',
                'down': 'ArrowDown',
                'left': 'ArrowLeft',
                'right': 'ArrowRight',
                'a': 'KeyX',        // X
                'b': 'KeyZ',        // Z
                'x': 'KeyS',        // S
                'y': 'KeyA',        // A
                'start': 'Enter',   // Enter
                'select': 'ShiftRight' // Shift
            };

            const keyMappingPlayer2 = {
                'up': 'Digit8',     // 8
                'down': 'Digit5',   // 5
                'left': 'Digit4',   // 4
                'right': 'Digit6',  // 6
                'a': 'KeyK',        // K
                'b': 'KeyJ',        // J
                'x': 'KeyM',        // M
                'y': 'KeyL',        // L
                'start': 'Digit2',  // 2
                'select': 'Digit1'  // 1
            };

            // Elementos do DOM
            const carouselTrack = document.getElementById('carouselTrack');
            const gameDetails = document.getElementById('gameDetails');
            const gameBackgrounds = document.getElementById('gameBackgrounds');
            const display = document.getElementById('display');
            const loading = document.getElementById('loading');
            const backButton = document.getElementById('backButton');
            const mainContainer = document.getElementById('mainContainer');
            const gameCount = document.getElementById('gameCount');
            const controllerBtn = document.getElementById('controllerBtn');
            const controllerModal = document.getElementById('controllerModal');
            const closeModal = document.getElementById('closeModal');
            const qrCodeImage = document.getElementById('qrCodeImage');
            const controllerURL = document.getElementById('controllerURL');
            const player1Status = document.getElementById('player1Status');
            const player2Status = document.getElementById('player2Status');

            // Inicializar Socket.IO
            function initSocket() {
                socket = io();

                socket.on('connect', () => {
                    console.log('✅ Conectado ao servidor Socket.IO');
                    socket.emit('register-screen');
                });

                socket.on('controller-connected', (data) => {
                    console.log(`✅ Jogador ${data.player} conectado`);
                    updatePlayerStatus(data.player, true);
                });

                socket.on('controller-disconnected', (data) => {
                    console.log(`❌ Jogador ${data.player} desconectado`);
                    updatePlayerStatus(data.player, false);
                });

                socket.on('game-input', (data) => {
                    console.log('🎮 Recebido input:', data);
                    handleControllerInput(data);
                });

                socket.on('controllers-status', (data) => {
                    updatePlayerStatus(1, data.player1);
                    updatePlayerStatus(2, data.player2);
                });
            }

            // Atualizar status do jogador
            function updatePlayerStatus(player, connected) {
                const statusEl = player === 1 ? player1Status : player2Status;
                if (connected) {
                    statusEl.textContent = `Jogador ${player}: Conectado ✓`;
                    statusEl.classList.add('connected');
                } else {
                    statusEl.textContent = `Jogador ${player}: Desconectado`;
                    statusEl.classList.remove('connected');
                }
            }

            // Processar input do controle
            function handleControllerInput(data) {
                // Selecionar o mapeamento correto baseado no jogador
                const keyMapping = data.player === 1 ? keyMappingPlayer1 : keyMappingPlayer2;
                const mappedKey = keyMapping[data.key];
                if (!mappedKey) {
                    console.warn('⚠️ Tecla não mapeada:', data.key);
                    return;
                }

                const keyCode = getKeyCode(mappedKey);
                const eventType = data.pressed ? 'keydown' : 'keyup';
                
                console.log(`🎯 P${data.player}: ${data.key} -> ${mappedKey} (keyCode: ${keyCode}) [${eventType}]`);

                // Método 1: Evento KeyboardEvent moderno
                try {
                    const keyEvent = new KeyboardEvent(eventType, {
                        key: getKeyName(mappedKey),
                        code: mappedKey,
                        keyCode: keyCode,
                        which: keyCode,
                        bubbles: true,
                        cancelable: true,
                        composed: true,
                        view: window
                    });

                    // Disparar em múltiplos alvos
                    const gameElement = document.getElementById('game');
                    const canvas = gameElement?.querySelector('canvas');
                    const iframe = gameElement?.querySelector('iframe');
                    
                    if (canvas) {
                        canvas.dispatchEvent(keyEvent);
                        console.log('📤 Evento enviado para canvas');
                    }
                    if (iframe) {
                        try {
                            iframe.contentWindow.document.dispatchEvent(keyEvent);
                            console.log('📤 Evento enviado para iframe');
                        } catch (e) {
                            console.log('⚠️ Não foi possível acessar iframe');
                        }
                    }
                    
                    gameElement?.dispatchEvent(keyEvent);
                    document.dispatchEvent(keyEvent);
                    window.dispatchEvent(keyEvent);
                    
                } catch (e) {
                    console.error('❌ Erro ao criar evento:', e);
                }

                // Método 2: Evento legado (para compatibilidade)
                try {
                    const event = document.createEvent('KeyboardEvent');
                    const initMethod = typeof event.initKeyboardEvent !== 'undefined' ? 
                        'initKeyboardEvent' : 'initKeyEvent';
                    
                    event[initMethod](
                        eventType, true, true, window, 0, 0, 0, 0, keyCode, keyCode
                    );
                    
                    document.dispatchEvent(event);
                } catch (e) {
                    // Silencioso - método alternativo
                }
            }

            // Obter nome da tecla
            function getKeyName(code) {
                const keyNameMap = {
                    'ArrowUp': 'ArrowUp',
                    'ArrowDown': 'ArrowDown',
                    'ArrowLeft': 'ArrowLeft',
                    'ArrowRight': 'ArrowRight',
                    'KeyX': 'x',
                    'KeyZ': 'z',
                    'KeyA': 'a',
                    'KeyS': 's',
                    'KeyJ': 'j',
                    'KeyK': 'k',
                    'KeyL': 'l',
                    'KeyM': 'm',
                    'Enter': 'Enter',
                    'ShiftRight': 'Shift',
                    'Digit1': '1',
                    'Digit2': '2',
                    'Digit4': '4',
                    'Digit5': '5',
                    'Digit6': '6',
                    'Digit8': '8'
                };
                return keyNameMap[code] || code;
            }

            // Obter keyCode para compatibilidade
            function getKeyCode(code) {
                const keyCodeMap = {
                    'ArrowUp': 38,
                    'ArrowDown': 40,
                    'ArrowLeft': 37,
                    'ArrowRight': 39,
                    'KeyX': 88,
                    'KeyZ': 90,
                    'KeyA': 65,
                    'KeyS': 83,
                    'KeyJ': 74,
                    'KeyK': 75,
                    'KeyL': 76,
                    'KeyM': 77,
                    'Enter': 13,
                    'ShiftRight': 16,
                    'Digit1': 49,
                    'Digit2': 50,
                    'Digit4': 52,
                    'Digit5': 53,
                    'Digit6': 54,
                    'Digit8': 56
                };
                return keyCodeMap[code] || 0;
            }

            // Abrir modal de controles
            controllerBtn.onclick = async () => {
                controllerModal.classList.add('active');
                
                // Carregar QR Code
                try {
                    const response = await fetch('/qrcode');
                    const data = await response.json();
                    qrCodeImage.src = data.qrcode;
                    controllerURL.textContent = data.url;
                } catch (error) {
                    console.error('Erro ao carregar QR Code:', error);
                    controllerURL.textContent = 'Erro ao gerar QR Code';
                }
            };

            // Fechar modal
            closeModal.onclick = () => {
                controllerModal.classList.remove('active');
            };

            // Fechar modal ao clicar fora
            controllerModal.onclick = (e) => {
                if (e.target === controllerModal) {
                    controllerModal.classList.remove('active');
                }
            };

            // Atualizar relógio
            function updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
            }
            updateTime();
            setInterval(updateTime, 60000);

            // Carregar jogos do JSON
            async function loadGames() {
                try {
                    const response = await fetch('jogosdisponiveis.json');
                    const data = await response.json();
                    jogos = data.jogos;
                    gameCount.textContent = `${jogos.length} JOGOS`;
                    renderGames();
                    selectGame(0);
                } catch (error) {
                    console.error('Erro ao carregar jogos:', error);
                }
            }

            // Renderizar jogos no carrossel
            function renderGames() {
                carouselTrack.innerHTML = '';
                gameBackgrounds.innerHTML = '';

                jogos.forEach((jogo, index) => {
                    // Card do jogo
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.dataset.index = index;
                    card.innerHTML = `
                        <img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.src='docs/Logo-light.png'">
                        <div class="game-card-title">${jogo.nome}</div>
                    `;
                    card.onclick = () => selectGame(index);
                    carouselTrack.appendChild(card);

                    // Background do jogo
                    const bg = document.createElement('div');
                    bg.className = 'game-background';
                    bg.dataset.index = index;
                    
                    // Tentar usar vídeo primeiro, se não existir usar imagem
                    if (jogo.video) {
                        bg.innerHTML = `<video autoplay loop muted><source src="${jogo.video}" type="video/mp4"></video>`;
                    } else {
                        bg.innerHTML = `<img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.style.display='none'">`;
                    }
                    
                    gameBackgrounds.appendChild(bg);
                });
            }

            // Selecionar jogo
            function selectGame(index) {
                if (index < 0 || index >= jogos.length) return;
                
                currentIndex = index;
                const jogo = jogos[index];

                // Atualizar cards
                document.querySelectorAll('.game-card').forEach((card, i) => {
                    card.classList.toggle('selected', i === index);
                });

                // Atualizar backgrounds
                document.querySelectorAll('.game-background').forEach((bg, i) => {
                    bg.classList.toggle('active', i === index);
                });

                // Atualizar detalhes
                gameDetails.classList.remove('active');
                setTimeout(() => {
                    gameDetails.innerHTML = `
                        <div class="game-title">${jogo.nome}</div>
                        <div class="game-meta">
                            <span>🎮 ${jogo.plataforma.toUpperCase()}</span>
                            <span>📅 ${jogo.ano}</span>
                            <span>👥 ${jogo.jogadores}</span>
                            <span>${jogo.genero}</span>
                        </div>
                        <div class="game-description">${jogo.descricao}</div>
                        <div class="game-actions">
                            <button class="btn btn-primary" onclick="playGame()">
                                ▶ Jogar Agora
                            </button>
                            <button class="btn btn-secondary" onclick="showInfo()">
                                ℹ️ Mais Informações
                            </button>
                        </div>
                    `;
                    gameDetails.classList.add('active');
                }, 100);

                // Centralizar no carrossel
                centerCarousel();
            }

            // Centralizar carrossel no jogo selecionado
            function centerCarousel() {
                const cardWidth = 200 + 25; // largura + gap
                const offset = currentIndex * cardWidth;
                const containerCenter = window.innerWidth / 2;
                const cardCenter = cardWidth / 2;
                const translation = containerCenter - cardCenter - offset - 80; // 80 é o padding
                carouselTrack.style.transform = `translateX(${translation}px)`;
            }

            // Navegação do carrossel
            document.getElementById('navLeft').onclick = () => {
                if (currentIndex > 0) {
                    selectGame(currentIndex - 1);
                }
            };

            document.getElementById('navRight').onclick = () => {
                if (currentIndex < jogos.length - 1) {
                    selectGame(currentIndex + 1);
                }
            };

            // Navegação por teclado
            document.addEventListener('keydown', (e) => {
                if (isGameRunning) return;

                switch(e.key) {
                    case 'ArrowLeft':
                        if (currentIndex > 0) selectGame(currentIndex - 1);
                        break;
                    case 'ArrowRight':
                        if (currentIndex < jogos.length - 1) selectGame(currentIndex + 1);
                        break;
                    case 'Enter':
                        playGame();
                        break;
                    case 'Escape':
                        if (isGameRunning) stopGame();
                        break;
                }
            });

            // Mostrar informações
            function showInfo() {
                const jogo = jogos[currentIndex];
                alert(`
🎮 ${jogo.nome}

📅 Ano: ${jogo.ano}
🎯 Gênero: ${jogo.genero}
👥 Jogadores: ${jogo.jogadores}
💿 Plataforma: ${jogo.plataforma.toUpperCase()}

📝 Descrição:
${jogo.descricao}

🎮 Core: ${jogo.configuracoes.core}
                `.trim());
            }

            // Jogar jogo
            async function playGame() {
                const jogo = jogos[currentIndex];
                
                loading.classList.add('active');
                mainContainer.style.display = 'none';
                
                setTimeout(() => {
                    runEmulator(jogo);
                }, 500);
            }

            // Executar emulador
            function runEmulator(jogo) {
                isGameRunning = true;
                display.classList.add('active');
                backButton.classList.add('active');
                loading.classList.remove('active');

                // Limpar emulador anterior se existir
                const gameDiv = document.getElementById('game');
                gameDiv.innerHTML = '';

                // Limpar variáveis globais do EmulatorJS para evitar redeclarações
                if (window.EJS_emulator) {
                    try {
                        window.EJS_emulator.destroy?.();
                    } catch (e) {
                        console.warn('Erro ao destruir emulador:', e);
                    }
                }
                
                // Limpar variáveis globais
                delete window.EmulatorJS;
                delete window.EJS_STORAGE;
                delete window.GamepadHandler;
                delete window.EJS_GameManager;
                delete window.EJSCompression;
                delete window.EJS_emulator;

                // Configurar EmulatorJS
                window.EJS_player = "#game";
                window.EJS_gameName = jogo.nome;
                window.EJS_biosUrl = jogo.configuracoes.biosUrl || "";
                window.EJS_gameUrl = jogo.arquivo;
                window.EJS_core = jogo.configuracoes.core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = jogo.configuracoes.debug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = jogo.configuracoes.threads;

                console.log('🎮 Configuração EmulatorJS:', {
                    player: window.EJS_player,
                    game: window.EJS_gameName,
                    gameUrl: window.EJS_gameUrl,
                    core: window.EJS_core,
                    biosUrl: window.EJS_biosUrl
                });

                // Remover scripts antigos do EmulatorJS
                const oldScripts = document.querySelectorAll('script[src^="data/"]');
                oldScripts.forEach(script => {
                    script.remove();
                    console.log('🗑️ Script removido:', script.src);
                });

                // Carregar EmulatorJS
                const script = document.createElement('script');
                script.src = "data/loader.js";
                script.onload = function() {
                    console.log('✅ EmulatorJS loader.js carregado');
                    
                    // Patch leve para handleResize (não bloqueia carregamento)
                    setTimeout(() => {
                        try {
                            if (window.EmulatorJS && window.EmulatorJS.prototype && window.EmulatorJS.prototype.handleResize) {
                                const originalHandleResize = window.EmulatorJS.prototype.handleResize;
                                window.EmulatorJS.prototype.handleResize = function() {
                                    try {
                                        if (this.game && this.game.parentElement) {
                                            originalHandleResize.call(this);
                                        }
                                    } catch (e) {
                                        // Silencioso
                                    }
                                };
                            }
                        } catch (e) {
                            console.log('Patch não aplicado:', e.message);
                        }
                    }, 1000);
                };
                script.onerror = function(error) {
                    console.error('❌ Erro ao carregar EmulatorJS:', error);
                    loading.classList.add('active');
                    const loadingText = loading.querySelector('p');
                    if (loadingText) loadingText.textContent = 'Erro ao carregar emulador';
                };
                document.body.appendChild(script);
            }

            // Parar jogo e voltar ao menu
            function stopGame() {
                if (confirm('Deseja realmente sair do jogo? O progresso não salvo será perdido.')) {
                    isGameRunning = false;
                    display.classList.remove('active');
                    backButton.classList.remove('active');
                    mainContainer.style.display = 'block';
                    
                    // Limpar emulador
                    const gameDiv = document.getElementById('game');
                    gameDiv.innerHTML = '';
                    
                    // Remover script do loader
                    const script = document.querySelector('script[src="data/loader.js"]');
                    if (script) {
                        script.remove();
                    }

                    // Re-selecionar o jogo atual para recarregar o background
                    selectGame(currentIndex);
                }
            }

            // Botão de voltar
            backButton.onclick = stopGame;

            // Redimensionar janela
            window.addEventListener('resize', () => {
                if (!isGameRunning) {
                    centerCarousel();
                }
            });

            // Inicializar
            initSocket();
            loadGames();
        </script>
    </body>
</html>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                console.log("Debug is enabled");
            } else {
                console.log("Debug is disabled");
            }

            if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                if (window.SharedArrayBuffer) {
                    enableThreads = true;
                    console.log("Threads are enabled");
                } else {
                    console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
                    console.log("Threads are disabled");
                }
            } else {
                console.log("Threads are disabled");
            }

            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    
                    if (["md", "sg", "smd", "gen"].includes(ext))
                        return "segaMD"

                    if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                        return ext

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet",
                        }
                        
                        if (enableThreads) {
                            coreValues["DOSBOX-PURE"] = "dosbox_pure";
                            coreValues["PlayStation Portable"] = "ppsspp";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext) {
                                resolve(core)
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove()
                div.appendChild(sub)
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = "";
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
