<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Arcade Station</title>
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body, html {
                height: 100%;
                width: 100%;
                overflow: hidden;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            /* Background animado */
            .background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
                z-index: -1;
            }

            .background::before {
                content: '';
                position: absolute;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 50px 50px;
                animation: backgroundMove 20s linear infinite;
            }

            @keyframes backgroundMove {
                0% { transform: translate(0, 0); }
                100% { transform: translate(-50px, -50px); }
            }

            /* Header estilo PS5 */
            .header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 60px;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(20px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 40px;
                z-index: 100;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .logo {
                font-size: 24px;
                font-weight: bold;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .time {
                font-size: 14px;
                opacity: 0.7;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 15px;
            }

            .user-avatar {
                width: 35px;
                height: 35px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
            }

            /* Container principal */
            .main-container {
                position: relative;
                width: 100%;
                height: calc(100% - 60px);
                margin-top: 60px;
                overflow: hidden;
            }

            /* Background de vídeo/imagem do jogo */
            .game-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 0.5s ease;
                overflow: hidden;
            }

            .game-background.active {
                opacity: 1;
            }

            .game-background::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, 
                    rgba(0,0,0,0.3) 0%, 
                    rgba(0,0,0,0.7) 50%, 
                    rgba(0,0,0,0.95) 100%);
            }

            .game-background img,
            .game-background video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(10px) brightness(0.6);
            }

            /* Detalhes do jogo selecionado */
            .game-details {
                position: absolute;
                bottom: 200px;
                left: 60px;
                max-width: 600px;
                z-index: 10;
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.5s ease;
            }

            .game-details.active {
                opacity: 1;
                transform: translateY(0);
            }

            .game-title {
                font-size: 48px;
                font-weight: bold;
                margin-bottom: 15px;
                text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            }

            .game-meta {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
                font-size: 14px;
                opacity: 0.8;
            }

            .game-meta span {
                padding: 5px 12px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 15px;
                backdrop-filter: blur(10px);
            }

            .game-description {
                font-size: 16px;
                line-height: 1.6;
                opacity: 0.9;
                margin-bottom: 30px;
                text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            }

            .game-actions {
                display: flex;
                gap: 15px;
            }

            .btn {
                padding: 15px 40px;
                border: none;
                border-radius: 25px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .btn-primary {
                background: white;
                color: #1a1a2e;
            }

            .btn-primary:hover {
                transform: scale(1.05);
                box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.2);
                color: white;
                backdrop-filter: blur(10px);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.3);
            }

            /* Carrossel de jogos estilo PS5 */
            .games-carousel {
                position: absolute;
                bottom: 40px;
                left: 0;
                right: 0;
                height: 140px;
                display: flex;
                align-items: center;
                z-index: 20;
                padding: 0 60px;
                overflow: visible;
            }

            .carousel-track {
                display: flex;
                gap: 20px;
                transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                padding: 10px 0;
            }

            .game-card {
                min-width: 180px;
                height: 120px;
                border-radius: 15px;
                overflow: hidden;
                cursor: pointer;
                position: relative;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                border: 3px solid transparent;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            .game-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 100%);
                z-index: 1;
                transition: opacity 0.3s ease;
            }

            .game-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.4s ease;
            }

            .game-card-title {
                position: absolute;
                bottom: 10px;
                left: 10px;
                right: 10px;
                font-size: 12px;
                font-weight: bold;
                z-index: 2;
                text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .game-card.selected {
                transform: scale(1.2) translateY(-15px);
                border-color: white;
                box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
                z-index: 10;
            }

            .game-card.selected img {
                transform: scale(1.1);
            }

            .game-card.selected .game-card-title {
                opacity: 1;
            }

            .game-card:hover:not(.selected) {
                transform: scale(1.05) translateY(-5px);
            }

            /* Navegação do carrossel */
            .carousel-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border: none;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                color: white;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 30;
            }

            .carousel-nav:hover {
                background: rgba(255, 255, 255, 0.3);
                transform: translateY(-50%) scale(1.1);
            }

            .carousel-nav.left {
                left: 10px;
            }

            .carousel-nav.right {
                right: 10px;
            }

            /* Display do emulador */
            #display {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
                display: none;
                background: black;
            }

            #display.active {
                display: block;
            }

            #game {
                width: 100%;
                height: 100%;
            }

            /* Loading */
            .loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 2000;
                display: none;
            }

            .loading.active {
                display: block;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            /* Botão de voltar */
            .back-button {
                position: fixed;
                top: 70px;
                left: 20px;
                z-index: 1001;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                padding: 10px 20px;
                border-radius: 25px;
                cursor: pointer;
                display: none;
                transition: all 0.3s ease;
            }

            .back-button.active {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .back-button:hover {
                background: rgba(0, 0, 0, 0.9);
                transform: scale(1.05);
            }

            /* Responsivo */
            @media (max-width: 768px) {
                .game-title {
                    font-size: 32px;
                }

                .game-details {
                    left: 20px;
                    right: 20px;
                    max-width: none;
                }

                .games-carousel {
                    padding: 0 20px;
                }

                .game-card {
                    min-width: 140px;
                    height: 100px;
                }
            }
        </style>
    </head>

    <body>
        <div class="background"></div>

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">🎮 ARCADE STATION</div>
                <div class="time" id="currentTime"></div>
            </div>
            <div class="user-info">
                <span id="gameCount">0 jogos</span>
                <div class="user-avatar">P1</div>
            </div>
        </div>

        <!-- Container Principal -->
        <div class="main-container" id="mainContainer">
            <!-- Backgrounds dos jogos -->
            <div id="gameBackgrounds"></div>

            <!-- Detalhes do jogo selecionado -->
            <div class="game-details" id="gameDetails"></div>

            <!-- Carrossel de jogos -->
            <div class="games-carousel">
                <button class="carousel-nav left" id="navLeft">◀</button>
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="carousel-nav right" id="navRight">▶</button>
            </div>
        </div>

        <!-- Display do emulador -->
        <div id="display">
            <div id="game"></div>
        </div>

        <!-- Botão de voltar -->
        <button class="back-button" id="backButton">
            ◀ Voltar ao menu
        </button>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <script>
            // Estado da aplicação
            let jogos = [];
            let currentIndex = 0;
            let isGameRunning = false;

            // Elementos do DOM
            const carouselTrack = document.getElementById('carouselTrack');
            const gameDetails = document.getElementById('gameDetails');
            const gameBackgrounds = document.getElementById('gameBackgrounds');
            const display = document.getElementById('display');
            const loading = document.getElementById('loading');
            const backButton = document.getElementById('backButton');
            const mainContainer = document.getElementById('mainContainer');
            const gameCount = document.getElementById('gameCount');

            // Atualizar relógio
            function updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
            }
            updateTime();
            setInterval(updateTime, 60000);

            // Carregar jogos do JSON
            async function loadGames() {
                try {
                    const response = await fetch('jogosdisponiveis.json');
                    const data = await response.json();
                    jogos = data.jogos;
                    gameCount.textContent = `${jogos.length} jogos`;
                    renderGames();
                    selectGame(0);
                } catch (error) {
                    console.error('Erro ao carregar jogos:', error);
                }
            }

            // Renderizar jogos no carrossel
            function renderGames() {
                carouselTrack.innerHTML = '';
                gameBackgrounds.innerHTML = '';

                jogos.forEach((jogo, index) => {
                    // Card do jogo
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.dataset.index = index;
                    card.innerHTML = `
                        <img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.src='docs/Logo-light.png'">
                        <div class="game-card-title">${jogo.nome}</div>
                    `;
                    card.onclick = () => selectGame(index);
                    carouselTrack.appendChild(card);

                    // Background do jogo
                    const bg = document.createElement('div');
                    bg.className = 'game-background';
                    bg.dataset.index = index;
                    
                    // Tentar usar vídeo primeiro, se não existir usar imagem
                    if (jogo.video) {
                        bg.innerHTML = `<video autoplay loop muted><source src="${jogo.video}" type="video/mp4"></video>`;
                    } else {
                        bg.innerHTML = `<img src="${jogo.imagem}" alt="${jogo.nome}" onerror="this.style.display='none'">`;
                    }
                    
                    gameBackgrounds.appendChild(bg);
                });
            }

            // Selecionar jogo
            function selectGame(index) {
                if (index < 0 || index >= jogos.length) return;
                
                currentIndex = index;
                const jogo = jogos[index];

                // Atualizar cards
                document.querySelectorAll('.game-card').forEach((card, i) => {
                    card.classList.toggle('selected', i === index);
                });

                // Atualizar backgrounds
                document.querySelectorAll('.game-background').forEach((bg, i) => {
                    bg.classList.toggle('active', i === index);
                });

                // Atualizar detalhes
                gameDetails.classList.remove('active');
                setTimeout(() => {
                    gameDetails.innerHTML = `
                        <div class="game-title">${jogo.nome}</div>
                        <div class="game-meta">
                            <span>🎮 ${jogo.plataforma.toUpperCase()}</span>
                            <span>📅 ${jogo.ano}</span>
                            <span>👥 ${jogo.jogadores}</span>
                            <span>${jogo.genero}</span>
                        </div>
                        <div class="game-description">${jogo.descricao}</div>
                        <div class="game-actions">
                            <button class="btn btn-primary" onclick="playGame()">
                                ▶ Jogar Agora
                            </button>
                            <button class="btn btn-secondary" onclick="showInfo()">
                                ℹ️ Mais Informações
                            </button>
                        </div>
                    `;
                    gameDetails.classList.add('active');
                }, 100);

                // Centralizar no carrossel
                centerCarousel();
            }

            // Centralizar carrossel no jogo selecionado
            function centerCarousel() {
                const cardWidth = 180 + 20; // largura + gap
                const offset = currentIndex * cardWidth;
                const containerCenter = window.innerWidth / 2;
                const cardCenter = cardWidth / 2;
                const translation = containerCenter - cardCenter - offset - 60; // 60 é o padding
                carouselTrack.style.transform = `translateX(${translation}px)`;
            }

            // Navegação do carrossel
            document.getElementById('navLeft').onclick = () => {
                if (currentIndex > 0) {
                    selectGame(currentIndex - 1);
                }
            };

            document.getElementById('navRight').onclick = () => {
                if (currentIndex < jogos.length - 1) {
                    selectGame(currentIndex + 1);
                }
            };

            // Navegação por teclado
            document.addEventListener('keydown', (e) => {
                if (isGameRunning) return;

                switch(e.key) {
                    case 'ArrowLeft':
                        if (currentIndex > 0) selectGame(currentIndex - 1);
                        break;
                    case 'ArrowRight':
                        if (currentIndex < jogos.length - 1) selectGame(currentIndex + 1);
                        break;
                    case 'Enter':
                        playGame();
                        break;
                    case 'Escape':
                        if (isGameRunning) stopGame();
                        break;
                }
            });

            // Mostrar informações
            function showInfo() {
                const jogo = jogos[currentIndex];
                alert(`
🎮 ${jogo.nome}

📅 Ano: ${jogo.ano}
🎯 Gênero: ${jogo.genero}
👥 Jogadores: ${jogo.jogadores}
💿 Plataforma: ${jogo.plataforma.toUpperCase()}

📝 Descrição:
${jogo.descricao}

🎮 Core: ${jogo.configuracoes.core}
                `.trim());
            }

            // Jogar jogo
            async function playGame() {
                const jogo = jogos[currentIndex];
                
                loading.classList.add('active');
                mainContainer.style.display = 'none';
                
                setTimeout(() => {
                    runEmulator(jogo);
                }, 500);
            }

            // Executar emulador
            function runEmulator(jogo) {
                isGameRunning = true;
                display.classList.add('active');
                backButton.classList.add('active');
                loading.classList.remove('active');

                // Limpar emulador anterior se existir
                const gameDiv = document.getElementById('game');
                gameDiv.innerHTML = '';

                // Configurar EmulatorJS
                window.EJS_player = "#game";
                window.EJS_gameName = jogo.nome;
                window.EJS_biosUrl = jogo.configuracoes.biosUrl || "";
                window.EJS_gameUrl = jogo.arquivo;
                window.EJS_core = jogo.configuracoes.core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = jogo.configuracoes.debug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = jogo.configuracoes.threads;

                // Remover script anterior se existir
                const oldScript = document.querySelector('script[src="data/loader.js"]');
                if (oldScript) {
                    oldScript.remove();
                }

                // Carregar EmulatorJS
                const script = document.createElement('script');
                script.src = "data/loader.js";
                document.body.appendChild(script);
            }

            // Parar jogo e voltar ao menu
            function stopGame() {
                if (confirm('Deseja realmente sair do jogo? O progresso não salvo será perdido.')) {
                    isGameRunning = false;
                    display.classList.remove('active');
                    backButton.classList.remove('active');
                    mainContainer.style.display = 'block';
                    
                    // Limpar emulador
                    const gameDiv = document.getElementById('game');
                    gameDiv.innerHTML = '';
                    
                    // Remover script do loader
                    const script = document.querySelector('script[src="data/loader.js"]');
                    if (script) {
                        script.remove();
                    }

                    // Re-selecionar o jogo atual para recarregar o background
                    selectGame(currentIndex);
                }
            }

            // Botão de voltar
            backButton.onclick = stopGame;

            // Redimensionar janela
            window.addEventListener('resize', () => {
                if (!isGameRunning) {
                    centerCarousel();
                }
            });

            // Inicializar
            loadGames();
        </script>
    </body>
</html>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                console.log("Debug is enabled");
            } else {
                console.log("Debug is disabled");
            }

            if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                if (window.SharedArrayBuffer) {
                    enableThreads = true;
                    console.log("Threads are enabled");
                } else {
                    console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
                    console.log("Threads are disabled");
                }
            } else {
                console.log("Threads are disabled");
            }

            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    
                    if (["md", "sg", "smd", "gen"].includes(ext))
                        return "segaMD"

                    if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                        return ext

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet",
                        }
                        
                        if (enableThreads) {
                            coreValues["DOSBOX-PURE"] = "dosbox_pure";
                            coreValues["PlayStation Portable"] = "ppsspp";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext) {
                                resolve(core)
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove()
                div.appendChild(sub)
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = "";
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
